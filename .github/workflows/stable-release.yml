name: Build A2 MESS HUB Stable Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  APP_ID: com.a2messhub.app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare latest Android project
        run: |
          git show adc9c41d296912d71f147431aaf636fbe80b9602:.github/workflows/build-expense-columns.yml > /tmp/feature-build.yml
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/feature-build.yml').read_text().splitlines()
          start=next(i for i,x in enumerate(lines) if x.strip()=='- name: Create Android project')
          py_start=next(i for i in range(start+1,len(lines)) if lines[i].strip()=="python - <<'PY'")
          py_end=next(i for i in range(py_start+1,len(lines)) if lines[i].strip()=='PY')
          body='\n'.join(x[10:] if x.startswith('          ') else x for x in lines[py_start+1:py_end])+'\n'
          Path('/tmp/feature-patch.py').write_text(body)
          PY
          python /tmp/feature-patch.py

      - name: Switch bill photo uploads to Cloudinary
        run: |
          python - <<'PY'
          from pathlib import Path
          candidates=[Path('www/app.html'),Path('android/app/src/main/assets/public/app.html')]
          for p in candidates:
              if not p.exists():
                  continue
              s=p.read_text()
              marker="async function uploadBill(file){"
              if marker not in s:
                  continue
              start=s.index(marker)
              end=s.index("\nwindow.pickExpensePhoto", start)
              replacement='''async function uploadBill(file){
  if(!file)throw new Error('Choose a bill photo first');
  if(file.type&&!file.type.startsWith('image/'))throw new Error('Bill file must be an image');
  const blob=await compressImage(file),fd=new FormData();
  fd.append('file',blob,'bill.jpg');
  fd.append('upload_preset','a2_mess_bills');
  fd.append('folder','A2-MESS-HUB/Bills');
  const res=await fetch('https://api.cloudinary.com/v1_1/rtsrjhpm/image/upload',{method:'POST',body:fd});
  if(!res.ok){let detail='';try{detail=await res.text()}catch{}throw new Error('Photo upload failed ('+res.status+')'+(detail?' '+detail.slice(0,140):''))}
  const j=await res.json();
  if(!j.secure_url||!j.public_id)throw new Error('Upload completed but Cloudinary did not return a photo URL');
  return{billUrl:j.secure_url,billFileId:j.public_id,imageProvider:'cloudinary'}
}'''
              s=s[:start]+replacement+s[end:]
              s=s.replace('Bill photos sync live using Uploadcare','Bill photos sync live using Cloudinary')
              s=s.replace("imageProvider:billUrl?'uploadcare':'',updatedAt:serverTimestamp()", "imageProvider:billUrl?(billUrl.includes('res.cloudinary.com')?'cloudinary':(old.imageProvider||'uploadcare')):'',updatedAt:serverTimestamp()")
              s=s.replace("({billUrl,billFileId}=await uploadBill(f));", "{const uploaded=await uploadBill(f);billUrl=uploaded.billUrl;billFileId=uploaded.billFileId;}")
              p.write_text(s)
          PY

      - name: Apply monthly payment consistency fix
        run: |
          python scripts/payment-calculation-fix.py www/app.html android/app/src/main/assets/public/app.html

      - name: Validate app JavaScript and required features
        run: |
          python - <<'PY'
          from pathlib import Path
          required=[
            'Expense Name','Added By','Read only','Total Receivable',
            'api.cloudinary.com/v1_1/rtsrjhpm/image/upload',
            "upload_preset','a2_mess_bills",'function currentBillingMonth()',
            'billingMonth','Member Balances','Payment Transactions',
            'paymentFormForMember','PARTIAL'
          ]
          for path in [Path('www/app.html'),Path('android/app/src/main/assets/public/app.html')]:
              s=path.read_text()
              missing=[x for x in required if x not in s]
              if missing: raise SystemExit(f'{path}: missing '+', '.join(missing))
              marker='<script type="module">'
              a=s.find(marker); b=s.find('</script>',a+len(marker))
              if a<0 or b<0: raise SystemExit(f'{path}: module script markers missing')
              out=Path('/tmp')/(path.parent.name+'-app-check.mjs')
              out.write_text(s[a+len(marker):b])
              print(out)
          PY
          node --check /tmp/www-app-check.mjs
          node --check /tmp/public-app-check.mjs

      - name: Set update version
        run: |
          RUN=${GITHUB_RUN_NUMBER}
          VERSION_CODE=$((20000 + RUN))
          VERSION_NAME="4.${RUN}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign with permanent A2 MESS HUB key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS_RAW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python - <<'PY'
          import os, base64, pathlib, unicodedata, re
          b64=''.join(os.environ['KEYSTORE_B64'].split())
          pathlib.Path('/tmp/a2messhub.jks').write_bytes(base64.b64decode(b64, validate=True))
          def clean(v):
              v=unicodedata.normalize('NFKC', v)
              v=re.sub(r'[\u200B-\u200D\uFEFF]','',v)
              return v.strip().strip('"').strip("'")
          store=clean(os.environ['STORE_PASS_RAW'])
          alias=clean(os.environ['KEY_ALIAS_RAW'])
          if not store.isascii() or not alias.isascii():
              raise SystemExit('Signing secret contains non-ASCII characters')
          pathlib.Path('/tmp/storepass').write_text(store)
          pathlib.Path('/tmp/keyalias').write_text(alias)
          PY
          STORE_PASS="$(cat /tmp/storepass)"
          KEY_ALIAS="$(cat /tmp/keyalias)"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ZIPALIGNED="/tmp/A2-MESS-HUB-aligned.apk"
          FINAL="/tmp/A2-MESS-HUB-STABLE.apk"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$UNSIGNED" "$ZIPALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/a2messhub.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$STORE_PASS" \
            --out "$FINAL" "$ZIPALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
          cp "$FINAL" A2-MESS-HUB-STABLE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: A2-MESS-HUB-STABLE-SIGNED-APK
          path: A2-MESS-HUB-STABLE.apk
          if-no-files-found: error
