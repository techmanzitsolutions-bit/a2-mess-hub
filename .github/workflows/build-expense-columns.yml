name: Build Android APK Expense Columns

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Android project
        run: |
          mkdir mobile
          cd mobile
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "A2 Mess Hub" "com.a2messhub.app" --web-dir=www
          mkdir -p www
          cp -r ../www/. ./www/
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('www/app.html')
          s=p.read_text()
          if 'mobile-fixes.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="mobile-fixes.css">\n</head>')
          s=s.replace("fd.append('UPLOADCARE_STORE','auto')","fd.append('UPLOADCARE_STORE','1')")
          old_upload="const j=await res.json(),uuid=j.file||Object.values(j).find(v=>typeof v==='string'&&v.length>10);if(!uuid)throw new Error('Upload completed but no photo ID returned');return{billUrl:`https://ucarecdn.com/${uuid}/`,billFileId:uuid}"
          new_upload="const j=await res.json(),raw=String(j.file||'').trim(),m=raw.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i),uuid=m?.[0];if(!uuid)throw new Error('Upload completed but Uploadcare returned an invalid photo ID');const billUrl=`https://bo3lvwuicj.ucarecd.net/${uuid}/`;return{billUrl,billFileId:uuid}"
          if old_upload in s:
              s=s.replace(old_upload,new_upload)
          else:
              s=s.replace('https://ucarecdn.com/${uuid}/','https://bo3lvwuicj.ucarecd.net/${uuid}/')

          old_dash="function dashboard(){const paid=state.data.payments.reduce((a,x)=>a+(x.status==='PAID'?Number(x.amount||0):0),0),exp=state.data.expenses.reduce((a,x)=>a+Number(x.amount||0),0);return`<div class=grid>${metric('Members',state.data.members.length)}${metric('Collected','AED '+paid.toFixed(0))}${metric('Expenses','AED '+exp.toFixed(0))}${metric('Balance','AED '+(paid-exp).toFixed(0))}</div>`}"
          new_dash=r'''function dashboard(){if(state.profile.role==='member'){const uid=auth.currentUser.uid,ownPayments=state.data.payments.filter(x=>x.uid===uid),member=state.data.members.find(x=>(x.uid||x.id)===uid)||{},planAmount=Number(String(member.plan||'').replace(/[^0-9.]/g,''))||0,totalReceivable=ownPayments.reduce((a,x)=>a+Number(x.amount||0),0)||planAmount,paid=ownPayments.reduce((a,x)=>a+(x.status==='PAID'?Number(x.amount||0):0),0),due=Math.max(totalReceivable-paid,0),totalExpense=state.data.expenses.reduce((a,x)=>a+Number(x.amount||0),0),cats={};state.data.expenses.forEach(x=>{const k=x.category||'General';cats[k]=(cats[k]||0)+Number(x.amount||0)});const entries=Object.entries(cats).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...entries.map(x=>x[1])),progress=totalReceivable?Math.min(100,(paid/totalReceivable)*100):0;return`<div class=grid>${metric('Total Receivable','AED '+totalReceivable.toFixed(2))}${metric('You Paid','AED '+paid.toFixed(2))}${metric('Balance Due','AED '+due.toFixed(2))}${metric('Total Mess Expense','AED '+totalExpense.toFixed(2))}</div><div class=card style="margin-top:12px"><div class=top><div><h3 style="margin:0">Payment Progress</h3><div class=small>Read only</div></div><b>${progress.toFixed(0)}%</b></div><div style="height:12px;background:#ffffff10;border-radius:99px;overflow:hidden;margin-top:12px"><div style="height:100%;width:${progress}%;background:linear-gradient(90deg,#45f0a6,#f6cb67);border-radius:99px"></div></div></div><div class=card style="margin-top:12px"><div class=top><div><h3 style="margin:0">Expense Chart</h3><div class=small>Mess expenses by category · view only</div></div><b>AED ${totalExpense.toFixed(2)}</b></div><div class=list style="margin-top:14px">${entries.length?entries.map(([name,val])=>`<div><div class=top style="font-size:13px"><span>${esc(name)}</span><b>AED ${val.toFixed(2)}</b></div><div style="height:10px;background:#ffffff10;border-radius:99px;overflow:hidden;margin-top:6px"><div style="height:100%;width:${Math.max(4,(val/max)*100)}%;background:linear-gradient(90deg,#45f0a6,#f6cb67);border-radius:99px"></div></div></div>`).join(''):'<p class=muted>No expenses recorded yet.</p>'}</div></div>`}const paid=state.data.payments.reduce((a,x)=>a+(x.status==='PAID'?Number(x.amount||0):0),0),exp=state.data.expenses.reduce((a,x)=>a+Number(x.amount||0),0);return`<div class=grid>${metric('Members',state.data.members.length)}${metric('Collected','AED '+paid.toFixed(0))}${metric('Expenses','AED '+exp.toFixed(0))}${metric('Balance','AED '+(paid-exp).toFixed(0))}</div>`}'''
          if old_dash in s:
              s=s.replace(old_dash,new_dash)

          marker="window.billImageError=img=>{img.style.display='none';const a=img.parentElement;if(a){a.textContent='View Bill Photo';a.className='billlink'}};"
          helper="function resolvedBillUrl(x){const raw=String(x?.billFileId||x?.billUrl||'');const m=raw.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);return m?`https://bo3lvwuicj.ucarecd.net/${m[0]}/`:String(x?.billUrl||'').replace('https://ucarecdn.com/','https://bo3lvwuicj.ucarecd.net/')}\n"+marker
          if 'function resolvedBillUrl(x)' not in s:
              if marker not in s: raise SystemExit('billImageError marker not found')
              s=s.replace(marker,helper)

          # Member gets a separate Expenses page, but it remains read-only.
          s=s.replace(":['dashboard','meals','payments','settings'];",":['dashboard','meals','expenses','payments','settings'];")

          css='''\n<style>\n.expense-table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:920px}.expense-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.expense-table th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#91b4a7;text-align:left;padding:0 10px 6px}.expense-table td{background:#ffffff06;padding:10px;vertical-align:middle}.expense-table tr td:first-child{border-radius:12px 0 0 12px}.expense-table tr td:last-child{border-radius:0 12px 12px 0}.expense-photo{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid #62efb43b;background:#02100c}.expense-date{white-space:nowrap}.expense-amount{white-space:nowrap;font-weight:900}.readonly-note{font-size:12px;color:#9ec4b5}.expense-mobile-label{display:none}@media(max-width:700px){.expense-wrap{overflow:visible}.expense-table{min-width:0;display:block}.expense-table thead{display:none}.expense-table tbody,.expense-table tr,.expense-table td{display:block;width:100%}.expense-table tr{background:#ffffff06;border-radius:16px;padding:12px;margin-bottom:10px}.expense-table td{background:transparent;padding:6px 0;border-radius:0!important;display:grid;grid-template-columns:105px minmax(0,1fr);gap:10px;align-items:center}.expense-mobile-label{display:block;color:#91b4a7;font-size:11px;text-transform:uppercase}.expense-photo{width:88px;height:88px}.expense-table td.actions-cell{display:block;padding-top:10px}}\n</style>\n'''
          if '.expense-table{' not in s:
              s=s.replace('</head>',css+'</head>')

          new_expenses=r'''function expenseDate(x){const d=x?.createdAt?.toDate?.()||x?.updatedAt?.toDate?.();return d?d.toLocaleDateString(): '—'}
function expenseAddedBy(x){return x?.createdByName||((x?.createdBy&&x.createdBy===auth.currentUser?.uid)?state.profile.name:'Admin / Chef')}
function expenses(){const canEdit=state.profile.role==='admin',canAdd=state.profile.role==='admin'||state.profile.role==='chef';return`<div class=top style="margin-top:14px"><div><p class=muted style="margin:0">All mess expense details</p>${state.profile.role==='member'?'<div class=readonly-note>Read only · no editing allowed</div>':''}</div>${canAdd?'<button class=btn onclick=expenseForm()>+ Expense</button>':''}</div><div class="card expense-wrap" style="margin-top:12px"><table class=expense-table><thead><tr><th>Date</th><th>Expense Name</th><th>Category</th><th>Amount</th><th>Bill Image</th><th>Added By</th><th>Actions</th></tr></thead><tbody>${state.data.expenses.length?state.data.expenses.map(x=>{const u=resolvedBillUrl(x);return`<tr><td class=expense-date><span class=expense-mobile-label>Date</span><span>${esc(expenseDate(x))}</span></td><td><span class=expense-mobile-label>Expense Name</span><b>${esc(x.title||'—')}</b></td><td><span class=expense-mobile-label>Category</span><span>${esc(x.category||'General')}</span></td><td class=expense-amount><span class=expense-mobile-label>Amount</span><span>AED ${Number(x.amount||0).toFixed(2)}</span></td><td><span class=expense-mobile-label>Bill Image</span>${u?`<span><a href="${esc(u)}" target=_blank rel=noopener><img class=expense-photo src="${esc(u)}-/preview/300x300/" alt="Bill photo" onerror="billImageError(this)"></a><br><a class=billlink href="${esc(u)}" target=_blank rel=noopener>View Bill</a></span>`:'<span class=muted>No image</span>'}</td><td><span class=expense-mobile-label>Added By</span><span>${esc(expenseAddedBy(x))}</span></td><td class=actions-cell><span class=expense-mobile-label>Actions</span>${canEdit?`<div class=actions><button class=ghost onclick="expenseFormById('${x.id}')">Edit</button><button class="ghost danger" onclick="delRecord('expenses','${x.id}','expense')">Delete</button></div>`:'<span class=muted>View only</span>'}</td></tr>`}).join(''):'<tr><td colspan=7 class=muted>No expenses recorded yet.</td></tr>'}</tbody></table></div>`}
'''
          pattern=r"function expenses\(\)\{.*?\nwindow\.expenseForm="
          m=re.search(pattern,s,flags=re.S)
          if not m: raise SystemExit('expenses function not found')
          s=s[:m.start()]+new_expenses+'window.expenseForm='+s[m.end():]

          # Existing bill preview also uses the normalized Uploadcare URL.
          s=s.replace("x.billUrl?x.billUrl+'-/preview/800x800/':''","resolvedBillUrl(x)?resolvedBillUrl(x)+'-/preview/800x800/':''")
          s=s.replace("${x.billUrl?'show':''}","${(x.billUrl||x.billFileId)?'show':''}")
          # Store creator display name on new expenses for the Added By column.
          s=s.replace("{...v,createdBy:auth.currentUser.uid,createdAt:serverTimestamp()}","{...v,createdBy:auth.currentUser.uid,createdByName:state.profile.name,createdAt:serverTimestamp()}")

          checks=['function resolvedBillUrl(x)','Expense Name','Bill Image','Added By','Read only · no editing allowed',"['dashboard','meals','expenses','payments','settings']",'bo3lvwuicj.ucarecd.net']
          for q in checks:
              if q not in s: raise SystemExit('missing patch: '+q)
          p.write_text(s)
          PY
          npx cap add android
          cp ../firebase/google-services.json android/app/google-services.json
          npx cap sync android
      - name: Verify expense columns
        run: |
          grep -q "Expense Name" mobile/android/app/src/main/assets/public/app.html
          grep -q "Bill Image" mobile/android/app/src/main/assets/public/app.html
          grep -q "Added By" mobile/android/app/src/main/assets/public/app.html
          grep -q "Read only" mobile/android/app/src/main/assets/public/app.html
          grep -q "function resolvedBillUrl(x)" mobile/android/app/src/main/assets/public/app.html
          grep -q "bo3lvwuicj.ucarecd.net" mobile/android/app/src/main/assets/public/app.html
          grep -q "Total Receivable" mobile/android/app/src/main/assets/public/app.html
      - name: Build APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: A2-Mess-Hub-V4-EXPENSE-COLUMNS-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
