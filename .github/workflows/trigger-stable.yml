name: Deploy A2 MESS HUB PWA Direct

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare PWA
        run: python scripts/prepare-pwa.py "$GITHUB_SHA"

      - name: Apply monthly payment consistency fix
        run: python scripts/payment-calculation-fix.py

      - name: Add global receivable totals
        run: python scripts/global-receivables-patch.py

      - name: Add user to member linking
        run: python scripts/user-member-link-patch.py

      - name: Add ADNOC LPG order launcher
        run: python scripts/gas-order-patch.py

      - name: Add admin monthly backup and restore
        run: python scripts/monthly-backup-patch.py

      - name: Add monthly closing and carry forward
        run: python scripts/monthly-closing-patch.py

      - name: Add member meal skip and kitchen counts
        run: python scripts/meal-skip-patch.py

      - name: Force member Skip Meal visibility
        run: python scripts/member-skip-visibility-fix.py

      - name: Add meal skip WhatsApp and email notifications
        run: python scripts/meal-skip-notification-patch.py

      - name: Ensure realtime meal skip sync
        run: python scripts/meal-skip-realtime-fix.py

      - name: Verify meal skip cloud writes
        run: python scripts/meal-skip-cloud-write-fix.py

      - name: Apply 5 PM daily meal skip cutoff
        run: python scripts/meal-skip-day-cutoff-patch.py

      - name: Validate app JavaScript and production features
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/a2-pwa/www/app.html').read_text()
          marker='<script type="module">'
          a=s.find(marker)
          if a < 0:
              raise SystemExit('Module script not found')
          start=a+len(marker)
          b=s.find('</script>',start)
          if b < 0:
              raise SystemExit('Module script end not found')
          js=s[start:b]
          Path('/tmp/a2-app-check.mjs').write_text(js)
          required=[
            'function currentBillingMonth()',
            'billingMonth',
            'Member Balances',
            'Payment Transactions',
            'Total Receivable',
            'Balance Due',
            'paymentFormForMember',
            'PARTIAL',
            'function globalPaymentSummary(',
            'Total Receivable (All Members)',
            'Total Received (All Members)',
            'Balance Pending (All Members)',
            "metric('Total Received'",
            "metric('Balance Pending'",
            'function linkedMemberForUser(u)',
            'Link with Member',
            'Reset Password',
            'window.resetUser=async email=>',
            'User created and member linked',
            'member record kept',
            'api.cloudinary.com/v1_1/rtsrjhpm/image/upload',
            'function gasOrder(){',
            'window.openAdnocGas=',
            'package=ae.gov.adnoc',
            "gas:'Order Gas'",
            'function backupPage(){',
            'window.downloadMonthlyBackup=',
            'window.restoreMonthlyBackup=',
            "backup:'Backup'",
            'A2-MESS-HUB-MONTHLY-BACKUP',
            'Expense bill-image links are included',
            'backup:backupPage',
            'function monthClosePage(){',
            'function closingPreview(month){',
            'window.closeSelectedMonth=async',
            'monthlyClosings',
            'carryToMonth',
            "closing:'Month Close'",
            'closing:monthClosePage',
            'A2-MESS-HUB-CLOSING-',
            'AED 200 = 1.00 share · 100 = 0.50 · 250 = 1.25',
            'function mealSkipPage(){',
            'window.setMealSkip=async',
            'window.cancelMealSkip=async',
            'mealSkips',
            "skipmeal:'Skip Meal'",
            'skipmeal:mealSkipPage',
            'Kitchen Meal Count',
            'NO NEED / SKIP',
            'Skip Meal changes cooking quantity only',
            'MEAL SKIP QUICK ACTION',
            'Skip Meal / No Need',
            'function mealSkipAlertMessage(',
            'openMealSkipNotifications(',
            'Meal Skip Notification Setup',
            'WhatsApp Admin',
            'Email Chef',
            "onSnapshot(collection(db,'mealSkips')",
            '● LIVE SYNC',
            'Cloud verification failed',
            'skip saved to cloud ✅',
            'NO NEED · CLOUD SAVED',
            "const mealSkipDayCutoff='17:00'",
            'Today’s skip closes at 5:00 PM',
            'mealSkipDateAllowed(date)',
            'Daily skip cutoff 17:00',
            'defaultDate=afterCutoff?uaeDateKey(1):uaeDateKey(0)'
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing production features: '+', '.join(missing))
          print('A2 MESS HUB production features and 5 PM meal skip cutoff present')
          PY
          node --check /tmp/a2-app-check.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/a2-pwa/www

      - name: Deploy A2 MESS HUB PWA
        id: deployment
        uses: actions/deploy-pages@v4
