name: Deploy A2 MESS HUB PWA Direct

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare PWA
        run: python scripts/prepare-pwa.py "$GITHUB_SHA"

      - name: Apply payment calculation fix
        run: python scripts/payment-calculation-fix.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/a2-pwa/www

      - name: Deploy A2 MESS HUB PWA
        id: deployment
        uses: actions/deploy-pages@v4
