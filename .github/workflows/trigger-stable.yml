name: Retire legacy A2 MESS HUB Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Build retirement redirect
        run: |
          mkdir -p /tmp/a2-retired
          cat > /tmp/a2-retired/app.html <<'HTML'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <title>A2 MESS HUB moved</title>
            <style>
              body{margin:0;min-height:100vh;display:grid;place-items:center;background:#04130f;color:#effff7;font-family:system-ui,-apple-system,Segoe UI,Roboto}
              main{width:min(92vw,620px);padding:32px;border:1px solid #42e49a44;border-radius:22px;background:#08271dcc;text-align:center}
              h1{margin:0 0 12px;color:#f6c34f}p{color:#b8d7cb;line-height:1.55}
              a{display:inline-block;margin-top:12px;padding:13px 18px;border-radius:13px;background:#24d58d;color:#03150f;text-decoration:none;font-weight:900}
            </style>
          </head>
          <body>
            <main>
              <h1>A2 MESS HUB has moved</h1>
              <p>The old Firebase/GitHub Pages application has been retired. Use the TECH MANZ server application from now on.</p>
              <a id="go" href="https://techmanz-server.tailbdad47.ts.net/">OPEN A2 MESS HUB</a>
            </main>
            <script>
              (async()=>{
                try{
                  if('serviceWorker' in navigator){
                    for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
                  }
                  if('caches' in window){
                    for(const k of await caches.keys()) await caches.delete(k);
                  }
                }catch(e){}
                setTimeout(()=>location.replace('https://techmanz-server.tailbdad47.ts.net/'),1200);
              })();
            </script>
          </body>
          </html>
          HTML
          cp /tmp/a2-retired/app.html /tmp/a2-retired/index.html
          cp /tmp/a2-retired/app.html /tmp/a2-retired/404.html
          cat > /tmp/a2-retired/sw.js <<'JS'
          self.addEventListener('install',()=>self.skipWaiting());
          self.addEventListener('activate',event=>event.waitUntil((async()=>{
            const keys=await caches.keys();
            await Promise.all(keys.map(k=>caches.delete(k)));
            await self.clients.claim();
          })()));
          self.addEventListener('fetch',event=>event.respondWith(fetch(event.request)));
          JS
          cp /tmp/a2-retired/sw.js /tmp/a2-retired/service-worker.js
          cat > /tmp/a2-retired/manifest.webmanifest <<'JSON'
          {"name":"A2 MESS HUB moved","short_name":"A2 MESS","start_url":"./app.html","display":"standalone"}
          JSON

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload retirement artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/a2-retired

      - name: Deploy retirement redirect
        id: deployment
        uses: actions/deploy-pages@v4
