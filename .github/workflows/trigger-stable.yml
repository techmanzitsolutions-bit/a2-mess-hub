name: Deploy A2 MESS HUB PWA Direct

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare PWA
        run: python scripts/prepare-pwa.py "$GITHUB_SHA"

      - name: Apply payment calculation fix
        run: python scripts/payment-calculation-fix.py

      - name: Validate app JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/a2-pwa/www/app.html').read_text()
          a=s.find('<script type="module">')
          b=s.rfind('</script>')
          if a < 0 or b < 0 or b <= a:
              raise SystemExit('Module script not found')
          js=s[a+22:b]
          Path('/tmp/a2-app-check.mjs').write_text(js)
          required=['AED 100','PARTIAL','Paid Amount','Due Amount','function planValue(v)']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing payment features: '+', '.join(missing))
          print('Payment features present')
          PY
          node --check /tmp/a2-app-check.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/a2-pwa/www

      - name: Deploy A2 MESS HUB PWA
        id: deployment
        uses: actions/deploy-pages@v4
