name: Trigger Stable APK

on:
  push:
    branches: [ main ]

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Start stable release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stable-release.yml --repo ${{ github.repository }} --ref main
