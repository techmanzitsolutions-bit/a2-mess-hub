name: Deploy A2 MESS HUB PWA Direct

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare latest A2 MESS HUB web app
        run: |
          git show adc9c41d296912d71f147431aaf636fbe80b9602:.github/workflows/build-expense-columns.yml > /tmp/feature-build.yml
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/feature-build.yml').read_text().splitlines()
          start=next(i for i,x in enumerate(lines) if x.strip()=='- name: Create Android project')
          py_start=next(i for i in range(start+1,len(lines)) if lines[i].strip()=="python - <<'PY'")
          py_end=next(i for i in range(py_start+1,len(lines)) if lines[i].strip()=='PY')
          body='\n'.join(x[10:] if x.startswith('          ') else x for x in lines[py_start+1:py_end])+'\n'
          Path('/tmp/feature-patch.py').write_text(body)
          PY
          mkdir -p /tmp/a2-pwa/www
          cp -r www/. /tmp/a2-pwa/www/
          cd /tmp/a2-pwa
          python /tmp/feature-patch.py

      - name: Switch bill photo uploads to Cloudinary
        run: |
          cd /tmp/a2-pwa/www
          python - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text()
          cloud_name='rtsrjhpm'
          preset='a2_mess_bills'
          marker="async function uploadBill(file){"
          if marker not in s:
              raise SystemExit('uploadBill function not found')
          start=s.index(marker)
          end=s.index("\nwindow.pickExpensePhoto", start)
          replacement=f'''async function uploadBill(file){{
  const blob=await compressImage(file),fd=new FormData();
  fd.append('file',blob,'bill.jpg');
  fd.append('upload_preset','{preset}');
  fd.append('folder','A2-MESS-HUB/Bills');
  const res=await fetch('https://api.cloudinary.com/v1_1/{cloud_name}/image/upload',{{method:'POST',body:fd}});
  if(!res.ok){{let detail='';try{{detail=await res.text()}}catch{{}}throw new Error('Photo upload failed ('+res.status+')'+(detail?' '+detail.slice(0,140):''))}}
  const j=await res.json();
  if(!j.secure_url||!j.public_id)throw new Error('Upload completed but Cloudinary did not return a photo URL');
  return{{billUrl:j.secure_url,billFileId:j.public_id,imageProvider:'cloudinary'}}
}}'''
          s=s[:start]+replacement+s[end:]
          s=s.replace('Bill photos sync live using Uploadcare','Bill photos sync live using Cloudinary')
          s=s.replace("imageProvider:billUrl?'uploadcare':'',updatedAt:serverTimestamp()", "imageProvider:billUrl?(billUrl.includes('res.cloudinary.com')?'cloudinary':(old.imageProvider||'uploadcare')):'',updatedAt:serverTimestamp()")
          s=s.replace("({billUrl,billFileId}=await uploadBill(f));", "{const uploaded=await uploadBill(f);billUrl=uploaded.billUrl;billFileId=uploaded.billFileId;}")
          p.write_text(s)
          PY
          grep -q 'api.cloudinary.com/v1_1/rtsrjhpm/image/upload' app.html
          grep -q "upload_preset','a2_mess_bills" app.html

      - name: Add installable PWA and automatic updates
        run: |
          cd /tmp/a2-pwa/www
          cat > manifest.webmanifest <<'EOF'
          {
            "id":"./",
            "name":"A2 MESS HUB",
            "short_name":"A2 MESS HUB",
            "description":"Eat • Track • Manage • Sync — Powered by TECHMANZ",
            "start_url":"./",
            "scope":"./",
            "display":"standalone",
            "orientation":"portrait-primary",
            "background_color":"#020907",
            "theme_color":"#06140f"
          }
          EOF
          cat > pwa.js <<'EOF'
          (()=>{let reloading=false;if('serviceWorker'in navigator){window.addEventListener('load',async()=>{try{const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});reg.update().catch(()=>{})}catch(e){console.warn(e)}});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload()})}})();
          EOF
          cat > sw.js <<'EOF'
          const BUILD='__BUILD_SHA__';const CACHE=`a2-mess-hub-${BUILD}`;const CORE=['./','./index.html','./app.html','./mobile-fixes.css','./manifest.webmanifest','./pwa.js'];self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting())));self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('a2-mess-hub-')&&k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;const u=new URL(e.request.url);if(u.origin!==location.origin)return;e.respondWith(fetch(e.request).then(r=>{if(r&&r.ok){const x=r.clone();caches.open(CACHE).then(c=>c.put(e.request,x))}return r}).catch(()=>caches.match(e.request).then(x=>x||caches.match('./index.html'))))});
          EOF
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g" sw.js
          python - <<'PY'
          from pathlib import Path
          head='<link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="A2 MESS HUB">'
          script='<script src="./pwa.js" defer></script>'
          for name in ('index.html','app.html'):
              p=Path(name);s=p.read_text()
              if 'manifest.webmanifest' not in s:s=s.replace('</head>',head+'\n</head>')
              if 'src="./pwa.js"' not in s:s=s.replace('</body>',script+'\n</body>')
              p.write_text(s)
          PY
          grep -q 'api.cloudinary.com/v1_1/rtsrjhpm/image/upload' app.html
          grep -q "$GITHUB_SHA" sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/a2-pwa/www
      - name: Deploy A2 MESS HUB PWA
        id: deployment
        uses: actions/deploy-pages@v4
