name: Deploy A2 MESS HUB PWA Direct

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare PWA
        run: python scripts/prepare-pwa.py "$GITHUB_SHA"
      - name: Apply monthly payment consistency fix
        run: python scripts/payment-calculation-fix.py
      - name: Add global receivable totals
        run: python scripts/global-receivables-patch.py
      - name: Normalize monthly payment ledger totals
        run: python scripts/payment-ledger-normalization-patch.py
      - name: Add user to member linking
        run: python scripts/user-member-link-patch.py
      - name: Fix user authentication/profile consistency
        run: python scripts/user-auth-consistency-fix.py
      - name: Add ADNOC LPG order launcher
        run: python scripts/gas-order-patch.py
      - name: Add admin monthly backup and restore
        run: python scripts/monthly-backup-patch.py
      - name: Add monthly closing and carry forward
        run: python scripts/monthly-closing-patch.py
      - name: Add member meal skip and kitchen counts
        run: python scripts/meal-skip-patch.py
      - name: Force member Skip Meal visibility
        run: python scripts/member-skip-visibility-fix.py
      - name: Add meal skip WhatsApp and email notifications
        run: python scripts/meal-skip-notification-patch.py
      - name: Ensure realtime meal skip sync
        run: python scripts/meal-skip-realtime-fix.py
      - name: Verify meal skip cloud writes
        run: python scripts/meal-skip-cloud-write-fix.py
      - name: Apply kitchen preparation meal skip cutoffs
        run: python scripts/meal-skip-day-cutoff-patch.py
      - name: Add expense search filters and ordered sorting
        run: python scripts/expense-search-sort-filter-patch.py
      - name: Apply professional UI refresh
        run: python scripts/pro-ui-refresh-patch.py
      - name: Apply premium settings and navigation UI
        run: python scripts/premium-settings-ui-patch.py
      - name: Apply full V5 approved app UI
        run: python scripts/v5-full-ui-patch.py
      - name: Restore member skip quick action in V5 shell
        run: python scripts/v5-member-quick-action-fix.py
      - name: Reconcile linked users in Admin user list
        run: python scripts/user-list-reconcile-patch.py
      - name: Apply Spark-safe user access controls
        run: python scripts/spark-safe-user-access-patch.py
      - name: Apply functional reference-screen actions
        run: python scripts/reference-ui-actions-patch.py
      - name: Apply clean monthly report UI
        run: python scripts/report-calculation-clarity-patch.py
      - name: Apply premium live-data dashboard
        run: python scripts/dashboard-v6-patch.py
      - name: Use one in-app bill viewer
        run: python scripts/bill-inline-viewer-patch.py
      - name: Apply exact approved TM Solutions branding
        run: python scripts/tm-solutions-branding-patch.py
      - name: Enforce approved branding after login and dynamic renders
        run: python scripts/tm-branding-runtime-guard.py
      - name: Validate app JavaScript and production features
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/a2-pwa/www')
          s=(root/'app.html').read_text()
          marker='<script type="module">'; a=s.find(marker)
          if a < 0: raise SystemExit('Module script not found')
          start=a+len(marker); b=s.find('</script>',start)
          if b < 0: raise SystemExit('Module script end not found')
          Path('/tmp/a2-app-check.mjs').write_text(s[start:b])
          required=['function currentBillingMonth()','billingMonth','Total Receivable','PARTIAL','function globalPaymentSummary(','function linkedMemberForUser(u)','Reset Password','api.cloudinary.com/v1_1/rtsrjhpm/image/upload','function gasOrder(){','function backupPage(){','function monthClosePage(){','monthlyClosings','function mealSkipPage(){','mealSkips','Kitchen Meal Count','NO NEED / SKIP','MEAL SKIP QUICK ACTION','Cloud verification failed','skip saved to cloud ✅',"const mealPrepCutoff='17:00'",'Dinner and the next day’s Lunch are prepared together','Prepared previous evening','function expenseDateKey(x)','Search expense, category or amount','All Categories','Newest First','Amount: High → Low','No expenses match your search/filter.','id="a2-pro-ui"','id="a2-premium-settings"','id="a2-v5-ui"','function morePage(){','v5-more-grid','Simple • Smart • Organized',"mobile=['dashboard','meals','expenses','reports','more']",'a2-shell-logo','page-${state.page}','function userRows()','Sync User List','window.repairLinkedUsers=async','Linked account detected','name="a2_new_login_email"','name="a2_new_login_password"','autocomplete="new-password"','auth/email-already-in-use','App profile removed only; Firebase Auth login still exists','Pending to Collect','Current Cash Balance','Expected Month Balance','Collection Progress',"const raw=(x?.amount!==undefined", "timestampMonth(p?.updatedAt)||'')",'tm-approved-logo','tm-solutions-approved.webp','Powered by','tm-approved-brand-runtime-guard','enforceApprovedTMBrand','openBillViewer','a2-bill-inline-viewer']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing production features: '+', '.join(missing))
          if 'How this report is calculated' in s: raise SystemExit('Formula explanation unexpectedly present')
          approved=root/'tm-solutions-approved.webp'
          if not approved.exists() or approved.stat().st_size < 4000: raise SystemExit('Approved TM Solutions logo asset missing/invalid')
          legacy=list(root.glob('techmanz-logo.*'))+list(root.glob('tm-solutions-logo.*'))+list(root.glob('tm-solutions-approved.svg'))
          if legacy: raise SystemExit('Non-approved branding assets still present: '+', '.join(p.name for p in legacy))

          visible_parts=[]
          for p in [root/'app.html',root/'index.html']:
              text=p.read_text(errors='ignore')
              text=re.sub(r'<script\b[^>]*>.*?</script>', '', text, flags=re.I|re.S)
              visible_parts.append(text)
          visible_parts.append((root/'mobile-fixes.css').read_text(errors='ignore'))
          visible_parts.append((root/'manifest.webmanifest').read_text(errors='ignore'))
          visible_scan='\n'.join(visible_parts)
          if re.search(r'TECH\s*MANZ|techmanz-logo|tm-solutions-logo\.(?:png|webp)|tm-logo-svg',visible_scan,re.I):
              raise SystemExit('Old or re-created TM branding still visible in live markup')
          if visible_scan.count('tm-solutions-approved.webp') < 2:
              raise SystemExit('Approved TM Solutions logo is not present in all expected live locations')
          print('A2 MESS HUB production features + approved TM logo everywhere + in-app bill viewer verified')
          PY
          node --check /tmp/a2-app-check.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/a2-pwa/www
      - name: Deploy A2 MESS HUB PWA
        id: deployment
        uses: actions/deploy-pages@v4
