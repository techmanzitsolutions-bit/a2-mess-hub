name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verify Firebase V4 source
        run: |
          test -f www/index.html
          test -f www/app.html
          test -f www/mobile-fixes.css
          test -f firebase/google-services.json
          grep -q "app.html" www/index.html
          grep -q "firebaseConfig" www/app.html
          grep -q "a2-mess-hub" www/app.html
          grep -q "No public signup" www/app.html
          grep -q "creatorAuth" www/app.html
          grep -q "Uploadcare" www/app.html
          grep -q "uploadBill" www/app.html
          grep -q "Bill photo" www/app.html
          grep -q "WhatsApp" www/app.html
          ! grep -q "A2MessHubDB" www/app.html
          ! grep -q "Create Account" www/app.html
      - name: Create Android project
        run: |
          mkdir mobile
          cd mobile
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "A2 Mess Hub" "com.a2messhub.app" --web-dir=www
          mkdir -p www
          cp -r ../www/. ./www/
          python - <<'PY'
          from pathlib import Path
          p=Path('www/app.html')
          s=p.read_text()
          if 'mobile-fixes.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="mobile-fixes.css">\n</head>')
          s=s.replace("fd.append('UPLOADCARE_STORE','auto')","fd.append('UPLOADCARE_STORE','1')")
          old="const j=await res.json(),uuid=j.file||Object.values(j).find(v=>typeof v==='string'&&v.length>10);if(!uuid)throw new Error('Upload completed but no photo ID returned');return{billUrl:`https://ucarecdn.com/${uuid}/`,billFileId:uuid}"
          new="const j=await res.json(),raw=String(j.file||'').trim(),m=raw.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i),uuid=m?.[0];if(!uuid)throw new Error('Upload completed but Uploadcare returned an invalid photo ID');const billUrl=`https://bo3lvwuicj.ucarecd.net/${uuid}/`;return{billUrl,billFileId:uuid}"
          if old in s:
              s=s.replace(old,new)
          else:
              s=s.replace('https://ucarecdn.com/${uuid}/','https://bo3lvwuicj.ucarecd.net/${uuid}/')
          if "UPLOADCARE_STORE','1'" not in s or "bo3lvwuicj.ucarecd.net" not in s or "invalid photo ID" not in s:
              raise SystemExit('Uploadcare CDN patch target not found')
          p.write_text(s)
          PY
          npx cap add android
          cp ../firebase/google-services.json android/app/google-services.json
          npx cap sync android
      - name: Verify packaged web assets
        run: |
          test -f mobile/android/app/src/main/assets/public/index.html
          test -f mobile/android/app/src/main/assets/public/app.html
          test -f mobile/android/app/src/main/assets/public/mobile-fixes.css
          test -f mobile/android/app/google-services.json
          grep -q "firebaseConfig" mobile/android/app/src/main/assets/public/app.html
          grep -q "No public signup" mobile/android/app/src/main/assets/public/app.html
          grep -q "Uploadcare" mobile/android/app/src/main/assets/public/app.html
          grep -q "mobile-fixes.css" mobile/android/app/src/main/assets/public/app.html
          grep -q "UPLOADCARE_STORE','1'" mobile/android/app/src/main/assets/public/app.html
          grep -q "invalid photo ID" mobile/android/app/src/main/assets/public/app.html
          grep -q "bo3lvwuicj.ucarecd.net" mobile/android/app/src/main/assets/public/app.html
          ! grep -q "https://ucarecdn.com/" mobile/android/app/src/main/assets/public/app.html
      - name: Build APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: A2-Mess-Hub-V4-UPLOADCARE-CDN-FIX-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
