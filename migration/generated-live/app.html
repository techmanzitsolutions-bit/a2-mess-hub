function planValue(v){const n=Number(String(v??'').replace(/[^0-9.]/g,''));return Number.isFinite(n)?n:0}
function paidValue(x){const raw=(x?.amount!==undefined&&x?.amount!==null&&x?.amount!=='')?x.amount:x?.paidAmount;const n=Number(raw??0);return Number.isFinite(n)?n:0}
function money(n){return Number(n||0).toFixed(2)}
function monthKey(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0');return `${y}-${m}`}
function currentBillingMonth(){return monthKey(new Date())}
function timestampMonth(v){try{const d=v?.toDate?.();return d?monthKey(d):''}catch{return ''}}
function paymentMonth(p){return String(p?.billingMonth||timestampMonth(p?.createdAt)||timestampMonth(p?.updatedAt)||'')}
function recordMonth(x){return String(x?.billingMonth||timestampMonth(x?.createdAt)||timestampMonth(x?.updatedAt)||currentBillingMonth())}
function memberKey(m){return String(m?.uid||m?.id||'')}
function linkedMember(uid){return state.data.members.find(m=>memberKey(m)===String(uid||''))}
function memberPaid(m,month=currentBillingMonth(),excludeId=''){const k=memberKey(m);return state.data.payments.reduce((sum,p)=>sum+((p.id!==excludeId&&String(p.uid||'')===k&&paymentMonth(p)===month)?paidValue(p):0),0)}
function paymentStatus(plan,paid){const due=Math.max(0,plan-paid);return paid<=0?'DUE':due>0?'PARTIAL':'PAID'}
function memberPlanForMonth(m,month=currentBillingMonth()){const plans=m?.planByMonth||{};if(Object.prototype.hasOwnProperty.call(plans,month))return planValue(plans[month]);return planValue(m?.planAmount||m?.plan)}
function memberPlanIsSet(m,month){return month<=currentBillingMonth()||Object.prototype.hasOwnProperty.call(m?.planByMonth||{},month)}
function memberSummary(m,month=currentBillingMonth()){const plan=memberPlanForMonth(m,month),paid=memberPaid(m,month),opening=priorClosingBalance(m,month),available=opening+paid,due=Math.max(0,plan-available),advance=Math.max(0,available-plan),status=advance>0.005?'ADVANCE':due<=0.005?'PAID':available>0.005?'PARTIAL':'DUE';return{plan,paid,opening,carryForward:opening,available,due,advance,status,month}}
function currentMonthExpenses(){const month=currentBillingMonth();return state.data.expenses.filter(x=>recordMonth(x)===month)}

function memberSnapshotPaid(m,month=currentBillingMonth()){
  const txPaid=memberPaid(m,month);
  if(state.profile?.role==='admin') return txPaid;
  const snapMonth=String(m?.currentBillingMonth||'');
  const snap=Number(m?.paidAmount||0);
  if(snapMonth===month || !snapMonth) return Number.isFinite(snap)?Math.max(0,snap):0;
  return 0;
}
function globalPaymentSummary(month=currentBillingMonth()){
  let receivable=0,received=0;
  state.data.members.forEach(m=>{
    const plan=planValue(m?.planAmount||m?.plan);
    const paid=Math.min(plan,memberSnapshotPaid(m,month));
    receivable+=plan;
    received+=paid;
  });
  return {receivable,received,balance:Math.max(0,receivable-received),month};
}

function linkedMemberForUser(u){if(!u)return null;return state.data.members.find(m=>String(m.id||'')===String(u.memberId||'')||String(m.uid||'')===String(u.uid||u.id||''))||null}
function userRows(){const byUid=new Map();state.data.users.forEach(u=>{const uid=String(u.uid||u.id||'');if(uid)byUid.set(uid,{...u,_source:'profile'})});state.data.members.forEach(m=>{const uid=String(m.uid||'').trim();if(!uid)return;const current=byUid.get(uid);if(current){byUid.set(uid,{...current,memberId:current.memberId||m.id,name:current.name||m.name,email:current.email||m.email||'',_linkedMemberId:m.id});return}byUid.set(uid,{id:uid,uid,name:m.name||'Member',email:m.email||'',role:'member',active:m.active!==false,memberId:m.id,_source:'member-fallback',_linkedMemberId:m.id})});return [...byUid.values()].sort((a,b)=>String(a.name||a.email||'').localeCompare(String(b.name||b.email||'')))}

async function compressImage(file){const url=URL.createObjectURL(file);try{const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=url});const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Could not process photo')),'image/jpeg',.78))}finally{URL.revokeObjectURL(url)}}
async function uploadBill(file){
  if(!file)throw new Error('Choose a bill photo first');
  if(file.type&&!file.type.startsWith('image/'))throw new Error('Bill file must be an image');
  const blob=await compressImage(file),fd=new FormData();
  fd.append('file',blob,'bill.jpg');
  fd.append('upload_preset','a2_mess_bills');
  fd.append('folder','A2-MESS-HUB/Bills');
  const res=await fetch('https://api.cloudinary.com/v1_1/rtsrjhpm/image/upload',{method:'POST',body:fd});
  if(!res.ok){let detail='';try{detail=await res.text()}catch{}throw new Error('Photo upload failed ('+res.status+')'+(detail?' '+detail.slice(0,140):''))}
  const j=await res.json();
  if(!j.secure_url||!j.public_id)throw new Error('Upload completed but Cloudinary did not return a photo URL');
  return{billUrl:j.secure_url,billFileId:j.public_id,imageProvider:'cloudinary'}
}

function monthDayRange(month){
  const [year,mon]=String(month).split('-').map(Number),days=new Date(year,mon,0).getDate();
  return{days,start:`${month}-01`,end:`${month}-${String(days).padStart(2,'0')}`}

function memberActiveDays(m,month){

  if(!joined||joined<=range.start)return range.days;
  if(joined>range.end)return 0;
  const joinDay=Number(joined.slice(8,10));
  return Math.max(0,range.days-joinDay+1)
}

  const range=monthDayRange(month),days=memberActiveDays(m,month),base=memberPlanForMonth(m,month)/200;
  return base*(days/range.days)

function uaeClock(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dubai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return{date:`${p.year}-${p.month}-${p.day}`,minutes:Number(p.hour)*60+Number(p.minute)}}
function uaeDateKey(offset=0){const p=uaeClock(),[y,m,d]=p.date.split('-').map(Number),x=new Date(Date.UTC(y,m-1,d+offset));return`${x.getUTCFullYear()}-${String(x.getUTCMonth()+1).padStart(2,'0')}-${String(x.getUTCDate()).padStart(2,'0')}`}

window.setMealSkip=async(meal,date)=>{
  if(state.profile?.role!=='member')return toast('Member only');
  if(!mealSkipOpen(date,meal))return toast('Skip cutoff has passed');
  const uid=auth.currentUser?.uid||'';
  if(!uid)return toast('Please login again');
  let member=state.data.members.find(m=>String(m.id||'')===String(state.profile.memberId||'')||String(m.uid||'')===String(uid));
  if(!member&&state.profile.memberId){
    try{const snap=await getDoc(doc(db,'members',state.profile.memberId));if(snap.exists())member={id:snap.id,...snap.data()}}catch(e){console.warn('member lookup failed',e)}
  }
  const memberId=member?.id||state.profile.memberId||uid;
  const memberName=member?.name||state.profile.name||auth.currentUser?.email||'Member';
  const id=`${uid}_${date}_${meal.toLowerCase()}`;
  const ref=doc(db,'mealSkips',id);
  try{
    await setDoc(ref,{uid,memberId,memberName,date,meal,status:'SKIPPED',cutoff:mealSkipCutoffs[meal],cutoffAt:mealCutoffDate(date,meal),createdAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});

    if(!verify.exists())throw new Error('Cloud verification failed');
    const saved={id:verify.id,...verify.data()};
    const i=(state.data.mealSkips||[]).findIndex(x=>x.id===id);
    if(i>=0)state.data.mealSkips[i]=saved;else state.data.mealSkips=[...(state.data.mealSkips||[]),saved];
    render();
    toast(`${meal} skip saved to cloud ✅`);
    if(typeof openMealSkipNotifications==='function')openMealSkipNotifications(memberName,meal,date);
  }catch(e){
    console.error('Meal skip cloud save failed',e);
    toast('Meal skip NOT saved: '+(e?.message||e));
  }
}

window.moveReportMonth=n=>{const d=new Date((window._reportMonth||currentBillingMonth())+'-01T00:00:00');d.setMonth(d.getMonth()+n);window._reportMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()};
function csv(v){return '"'+String(v??'').replaceAll('"','""')+'"'}function downloadCsv(name,rows){const b=new Blob([rows.map(r=>r.map(csv).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.exportMemberReport=()=>{const m=window._reportMonth||currentBillingMonth();downloadCsv(`A2-Members-${m}.csv`,[['Member','Plan AED','Carry Forward AED','Paid This Month AED','Due AED','Advance AED','Status'],...state.data.members.map(x=>{const q=memberSummary(x,m);return[x.name,q.plan,q.opening,q.paid,q.due,q.advance,q.status]})])};window.exportExpenseReport=()=>{const m=window._reportMonth||currentBillingMonth();downloadCsv(`A2-Expenses-${m}.csv`,[['Expense','Category','Amount AED'],...state.data.expenses.filter(x=>expenseMonth(x)===m).map(x=>[x.title,x.category||'General',x.amount||0])])};window.exportFullReport=()=>{exportMemberReport();setTimeout(exportExpenseReport,250)};


function pendingPaymentMembers(month){
  return state.data.members.map(m=>({m,q:memberSummary(m,month)})).filter(x=>Number(x.q.due||0)>.009)
}
function pendingPaymentMessage(name,month,plan,paid,due,opening=0,advance=0){
  const carryLine=Number(opening)>=0?`Advance carry forward: AED ${money(Math.abs(opening))}`:`Due carry forward: AED ${money(Math.abs(opening))}`;
  return `A2 MESS HUB
Hi ${name},

Our current mess cash balance is low, and the available amount may be used for essential purchases within the next 1–2 days.

Your ${month} mess payment status:
Plan: AED ${money(plan)}
${carryLine}
Paid this month: AED ${money(paid)}
Balance due: AED ${money(due)}
Advance balance: AED ${money(advance)}

${Number(due)>0?'Please complete the pending payment as soon as possible so we can continue purchasing mess supplies without interruption.':'Your account has no pending payment.'}

Thank you.
— A2 MESS HUB`
}
window.sendPendingPaymentWhatsApp=(memberId,month)=>{
  const m=state.data.members.find(x=>String(x.id)===String(memberId));
  if(!m)return toast('Member not found');
  const q=memberSummary(m,month),phone=String(m.phone||'').replace(/\D/g,'');
  if(!phone)return toast((m.name||'Member')+' has no WhatsApp number');
  const text=encodeURIComponent(pendingPaymentMessage(m.name||'Member',month,q.plan,q.paid,q.due,q.opening,q.advance));
  window.open(`https://wa.me/${phone}?text=${text}`,'_blank','noopener')
};
window.openPendingPaymentReminders=()=>{
  if(state.profile?.role!=='admin')return toast('Admin only');
  const month=window._reportMonth||currentBillingMonth(),rows=pendingPaymentMembers(month);
  if(!rows.length)return toast('All members are fully paid for '+month);
  const total=rows.reduce((a,x)=>a+Number(x.q.due||0),0);
  modal(`<div class=top><div><h3 style="margin:0">💬 Notify Pending Members</h3><div class=small>${rows.length} unpaid member(s) · AED ${money(total)} pending</div></div><button class=ghost onclick=closeM()>✕</button></div><div class=note style="margin-top:12px">The same cash-low reminder is prepared separately for every Due or Partial member. Tap WhatsApp, then tap Send. Fully paid members are excluded.</div><div class=list style="margin-top:12px">${rows.map(({m,q})=>`<div class=row><span><b>${esc(m.name||'Member')}</b><small class=muted> · ${q.status} · Due AED ${money(q.due)}</small></span><span>${m.phone?esc(m.phone):'<span class=muted>No phone</span>'}</span><span></span><span><button class=btn ${m.phone?'':'disabled'} onclick="sendPendingPaymentWhatsApp('${esc(m.id)}','${month}')">WhatsApp</button></span></div>`).join('')}</div><div class=note style="margin-top:12px">WhatsApp does not permit silent bulk sending from this free web app. Each message opens ready to send, protecting members’ phone numbers and avoiding an exposed group chat.</div>`)
};

function render(){if(!state.profile)return;let body='';try{body=({dashboard,users,members,meals,skipmeal:mealSkipPage,inventory,expenses,payments,gas:gasOrder,closing:monthClosePage,reports,backup:backupPage,settings,more:morePage}[state.page]||dashboard)()}catch(e){body=`<div class=card><h3>Page error</h3><p>${esc(e.message)}</p></div>`}layout(body)}
onAuthStateChanged(auth,async u=>{state.unsubs.forEach(f=>f());state.unsubs=[];state.profile=null;if(!u){setTimeout(showAuth,250);return}try{const p=await getDoc(doc(db,'users',u.uid));if(!p.exists()){await signOut(auth);return toast('Account has no assigned role. Contact Admin.')}state.profile={uid:u.uid,...p.data()};if(state.profile.active===false){await signOut(auth);return toast('Account disabled')}state.page='dashboard';listen();render()}catch(e){err(e);await signOut(auth)}});
</script>
<script src="./pwa.js" defer></script>
<script id="a2-live-notifications-runtime">(()=>{let open=false;function build(){const d=window.state?.data||{},a=[];(d.payments||[]).slice(-15).forEach(x=>a.push(['Payment Received',`${x.memberName||x.name||'Member'} · AED ${Number(x.amount??x.paidAmount??0).toFixed(2)}`]));(d.expenses||[]).slice(-15).forEach(x=>a.push(['Expense Added',`${x.category||x.description||'Expense'} · AED ${Number(x.amount||0).toFixed(2)}`]));let b=document.getElementById('a2NotifyBell');if(!b){b=document.createElement('button');b.id='a2NotifyBell';b.className='a2-notify-bell';b.textContent='🔔';b.onclick=()=>{open=!open;build()};document.body.appendChild(b)}document.getElementById('a2NotifyPanel')?.remove();if(open){let p=document.createElement('div');p.id='a2NotifyPanel';p.className='a2-notify-panel';p.innerHTML='<b>🔔 Live Notifications</b>'+a.reverse().map(x=>`<div class="a2-notify-item"><b>${x[0]}</b><div>${x[1]}</div></div>`).join('');document.body.appendChild(p)}}setInterval(build,5000);setTimeout(build,1200)})();</script><script id="a2PushRenderObserver">new MutationObserver(()=>{if(window.installA2PushButton)window.installA2PushButton()}).observe(document.getElementById('app'),{childList:true,subtree:true});</script>
<script id="tm-approved-brand-runtime-guard">
(()=>{
  const APPROVED='./tm-solutions-approved.webp';
  const logo=()=>`<span class="tm-approved-logo-wrap"><img class="tm-approved-logo" src="${APPROVED}" alt="TM Solutions"></span>`;
  const brand=()=>`<span class="tm-powered-label">Powered by</span>${logo()}`;
  let busy=false;
  function enforceApprovedBrand(){
    if(busy)return; busy=true;
    try{
      document.querySelectorAll('.powered,.tm-powered,.tech').forEach(el=>{
        const text=(el.textContent||'').trim().toLowerCase();
        if(el.classList.contains('powered')||el.classList.contains('tm-powered')||text.includes('powered by')||text.includes('techmanz')||text.includes('tech manz')){
          el.classList.add('tm-powered');
          if(!el.querySelector('img.tm-approved-logo') || el.querySelector('img.tm-approved-logo')?.getAttribute('src')!==APPROVED) el.innerHTML=brand();
        }
      });
      document.querySelectorAll('img').forEach(img=>{
        const src=(img.getAttribute('src')||'').toLowerCase();
        const alt=(img.getAttribute('alt')||'').toLowerCase();
        if((src.includes('techmanz')||src.includes('tm-solutions-logo')||alt.includes('tech manz'))&&!img.classList.contains('tm-approved-logo')){
          img.src=APPROVED; img.alt='TM Solutions'; img.className='tm-approved-logo';
        }
      });
    } finally {busy=false}
  }
  document.addEventListener('DOMContentLoaded',enforceApprovedBrand);
  new MutationObserver(()=>requestAnimationFrame(enforceApprovedBrand)).observe(document.documentElement,{subtree:true,childList:true});
  window.enforceApprovedTMBrand=enforceApprovedBrand;
})();
</script>
