<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061410"><title>A2 Mess Hub V3</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto;background:radial-gradient(circle at 15% 0,#164b3a,#04110e 42%);color:#effff8;min-height:100vh}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.box,.card{background:#09251ee8;border:1px solid #50ffad28;border-radius:22px;padding:18px;box-shadow:0 20px 60px #0006}.box{width:min(760px,100%)}.logo{font-size:66px;font-weight:1000;text-align:center;color:#f5ca64;text-shadow:0 0 25px #f5ca6444;animation:pulse 2.6s infinite}.tagline{text-align:center;color:#9bbcaf}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button,.nav button,.ghost{border:1px solid #50ffad20;background:#ffffff08;color:#dff8ee;border-radius:12px;padding:10px 12px;cursor:pointer}.tabs button.on,.nav button.on{background:#2df29320;color:#45f8a5}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field label{font-size:12px;color:#9bbcaf}.field input,.field select,.field textarea{background:#061b16;color:white;border:1px solid #50ffad25;border-radius:12px;padding:11px}.span2{grid-column:span 2}.btn{border:0;border-radius:14px;padding:12px 15px;background:linear-gradient(135deg,#37f59c,#00bf72);color:#032117;font-weight:900;cursor:pointer}.danger{background:#ff6671;color:white}.warnb{background:#ffba50;color:#2a1800}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{padding:18px;background:#03140fe8;border-right:1px solid #50ffad20}.brand{font-size:21px;font-weight:1000;color:#f5ca64;margin-bottom:18px}.nav{display:grid;gap:7px}.nav button{text-align:left}.main{padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:#92b3a7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:16px}.three{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr 1fr}.value{font-size:28px;font-weight:1000;margin:7px 0}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:1.5fr .8fr .7fr auto;gap:8px;align-items:center;padding:11px;background:#ffffff07;border-radius:13px}.tag{padding:5px 8px;border-radius:99px;background:#36f49a;color:#032117;font-size:11px;font-weight:900;display:inline-block}.bad{background:#ff6671;color:#fff}.warn{background:#ffba50;color:#2a1800}.bar{height:8px;background:#12382d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#36f49a,#f5ca64)}.actions{display:flex;gap:6px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:20}.modal .card{width:min(620px,100%);max-height:88vh;overflow:auto}.toast{position:fixed;right:16px;bottom:16px;background:#0f402f;border:1px solid #48f3a345;border-radius:14px;padding:12px 15px;z-index:30}.bottom{display:none}
@media(max-width:900px){.app{display:block}.side{display:none}.main{padding:15px 12px 84px}.grid,.three,.two{grid-template-columns:1fr 1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:8px;right:8px;bottom:8px;background:#062019f5;border:1px solid #50ffad25;border-radius:18px;padding:6px;z-index:10}.bottom button{border:0;background:transparent;color:#91b1a5;padding:9px 2px;font-size:11px}.bottom button.on{color:#39f39b}.row{grid-template-columns:1.2fr .7fr auto}.hide-sm{display:none}}
@media(max-width:560px){.form,.grid,.three,.two{grid-template-columns:1fr}.span2{grid-column:auto}.box{padding:15px}.top h2{font-size:22px}}
@keyframes pulse{50%{transform:scale(1.035);text-shadow:0 0 42px #f5ca6470}}
</style></head><body><div id="app"></div>
<script>
const DB={db:null,open(){return new Promise((res,rej)=>{const r=indexedDB.open("A2MessHubDB",1);r.onupgradeneeded=e=>{const d=e.target.result;["accounts","members","inventory","expenses","meals","payments"].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id",autoIncrement:true})})};r.onsuccess=e=>{this.db=e.target.result;res()};r.onerror=rej})},all(s){return new Promise((res,rej)=>{const r=this.db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=rej})},add(s,v){return new Promise((res,rej)=>{const r=this.db.transaction(s,"readwrite").objectStore(s).add(v);r.onsuccess=()=>res(r.result);r.onerror=rej})},put(s,v){return new Promise((res,rej)=>{const r=this.db.transaction(s,"readwrite").objectStore(s).put(v);r.onsuccess=()=>res(r.result);r.onerror=rej})},del(s,id){return new Promise((res,rej)=>{const r=this.db.transaction(s,"readwrite").objectStore(s).delete(id);r.onsuccess=()=>res();r.onerror=rej})}};
const S={user:null,page:"dashboard",authMode:"login",data:{members:[],inventory:[],expenses:[],meals:[],payments:[]}};
const N={dashboard:"Dashboard",members:"Members",meals:"Meals",inventory:"Inventory",expenses:"Expenses",payments:"Payments",reports:"Reports",settings:"Settings"};
function toast(m){const x=document.createElement("div");x.className="toast";x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),1600)}
async function refresh(){for(const x of ["members","inventory","expenses","meals","payments"])S.data[x]=await DB.all(x)}
async function seed(){if((await DB.all("inventory")).length===0){for(const x of [{name:"Rice",qty:18,unit:"KG",min:5},{name:"Chicken",qty:8,unit:"KG",min:3},{name:"Onion",qty:10,unit:"KG",min:3},{name:"Oil",qty:6,unit:"L",min:2},{name:"Egg",qty:60,unit:"pcs",min:20}])await DB.add("inventory",x)}if((await DB.all("meals")).length===0){for(const x of [{slot:"Breakfast",menu:"Idli + Sambar",date:"Today"},{slot:"Lunch",menu:"Chicken Biryani",date:"Today"},{slot:"Dinner",menu:"Chapati + Curry",date:"Today"}])await DB.add("meals",x)}}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function modal(h){document.body.insertAdjacentHTML("beforeend",`<div class=modal id=modal><div class=card>${h}</div></div>`)}function closeM(){document.getElementById("modal")?.remove()}
function loginUI(){app.innerHTML=`<div class=login><div class=box><div class=logo>A2</div><h1 style="text-align:center;margin:0">MESS HUB V3</h1><p class=tagline>Eat • Track • Manage • Real Device Database</p><div class=tabs><button class="${S.authMode==="login"?"on":""}" onclick="S.authMode='login';loginUI()">Login</button><button class="${S.authMode==="signup"?"on":""}" onclick="S.authMode='signup';loginUI()">Create Account</button></div>${S.authMode==="login"?`<div class=form><div class="field span2"><label>Email</label><input id=lemail type=email placeholder="you@example.com"></div><div class="field span2"><label>Password</label><input id=lpass type=password placeholder="Password"></div><div class=span2><button class=btn onclick=doLogin()>LOGIN</button></div></div>`:`<div class=form><div class=field><label>Name</label><input id=sname></div><div class=field><label>Role</label><select id=srole><option value=admin>Admin</option><option value=chef>Chef</option><option value=member>Member</option></select></div><div class="field span2"><label>Email</label><input id=semail type=email></div><div class="field span2"><label>Password</label><input id=spass type=password minlength=4></div><div class=span2><button class=btn onclick=signup()>CREATE ACCOUNT</button></div></div>`}<p class=muted style="text-align:center">Accounts and data are stored on this device inside the app database.</p></div></div>`}
async function signup(){const name=sname.value.trim(),email=semail.value.trim().toLowerCase(),pass=spass.value;if(!name||!email||pass.length<4)return toast("Enter valid account details");const a=await DB.all("accounts");if(a.some(x=>x.email===email))return toast("Account already exists");await DB.add("accounts",{name,email,pass,role:srole.value});toast("Account created");S.authMode="login";loginUI()}
async function doLogin(){const email=lemail.value.trim().toLowerCase(),pass=lpass.value;const u=(await DB.all("accounts")).find(x=>x.email===email&&x.pass===pass);if(!u)return toast("Invalid email or password");S.user=u;sessionStorage.setItem("a2user",JSON.stringify(u));S.page="dashboard";await refresh();render()}
function logout(){S.user=null;sessionStorage.removeItem("a2user");loginUI()}function go(p){S.page=p;render()}
function pages(){return S.user.role==="admin"?["dashboard","members","meals","inventory","expenses","payments","reports","settings"]:S.user.role==="chef"?["dashboard","meals","inventory","settings"]:["dashboard","meals","payments","settings"]}
function k(l,v,s){return `<div class=card><div class=muted>${l}</div><div class=value>${v}</div><small>${s}</small></div>`}
function dashboard(){const paid=S.data.payments.filter(x=>x.status==="PAID").reduce((a,b)=>a+(+b.amount||0),0),exp=S.data.expenses.reduce((a,b)=>a+(+b.amount||0),0);if(S.user.role==="member")return `<div class=card><h3>Welcome, ${esc(S.user.name)}</h3><p class=muted>Your member account is active on this device.</p></div><div class="grid three">${S.data.meals.map(x=>`<div class=card><h3>${esc(x.slot)}</h3><div class=value style="font-size:20px">${esc(x.menu)}</div><span class=tag>${esc(x.date)}</span></div>`).join("")}</div>`;return `<div class=grid>${k("Members",S.data.members.length,"Database records")}${k("Collected","AED "+paid.toFixed(0),"Payments")}${k("Expenses","AED "+exp.toFixed(0),"Recorded")}${k("Balance","AED "+(paid-exp).toFixed(0),"Net")}</div><div class="grid three">${S.data.meals.map(x=>`<div class=card><h3>${esc(x.slot)}</h3><div class=value style="font-size:20px">${esc(x.menu)}</div><div class=bar><i style="width:${x.slot==="Lunch"?68:92}%"></i></div></div>`).join("")}</div>`}
function memberForm(x={}){modal(`<div class=top><h3>${x.id?"Edit":"Add"} Member</h3><button class=ghost onclick=closeM()>✕</button></div><div class=form><div class=field><label>Name</label><input id=mname value="${esc(x.name||"")}"></div><div class=field><label>Plan</label><select id=mplan><option ${x.plan==="Basic"?"selected":""}>Basic</option><option ${x.plan==="Premium"?"selected":""}>Premium</option></select></div><div class=field><label>Amount</label><input id=mamount type=number value="${x.amount||250}"></div><div class=field><label>Status</label><select id=mstatus><option ${x.status==="PAID"?"selected":""}>PAID</option><option ${x.status==="DUE"?"selected":""}>DUE</option></select></div><div class=span2><button class=btn onclick="saveMember(${x.id||"null"})">SAVE</button></div></div>`)}
async function saveMember(id){const v={name:mname.value.trim(),plan:mplan.value,amount:+mamount.value,status:mstatus.value};if(!v.name)return toast("Name required");if(id)v.id=id;id?await DB.put("members",v):await DB.add("members",v);closeM();await refresh();render();toast("Member saved")}
async function editMember(id){memberForm(S.data.members.find(x=>x.id===id))}async function delRec(store,id){if(!confirm("Delete this record?"))return;await DB.del(store,id);await refresh();render();toast("Deleted")}
function members(){return `<div class=top><h3>Members (${S.data.members.length})</h3><button class=btn onclick=memberForm()>+ Add Member</button></div><div class="card list" style="margin-top:12px">${S.data.members.length?S.data.members.map(x=>`<div class=row><span><b>${esc(x.name)}</b><small class=muted> · ${esc(x.plan)}</small></span><span>AED ${x.amount}</span><span class="tag ${x.status==="DUE"?"bad":""}">${x.status}</span><span class=actions><button class=ghost onclick=editMember(${x.id})>Edit</button><button class="ghost danger" onclick="delRec('members',${x.id})">Del</button></span></div>`).join(""):`<p class=muted>No members yet. Tap Add Member.</p>`}</div>`}
function invForm(x={}){modal(`<div class=top><h3>${x.id?"Edit":"Add"} Stock</h3><button class=ghost onclick=closeM()>✕</button></div><div class=form><div class=field><label>Item</label><input id=iname value="${esc(x.name||"")}"></div><div class=field><label>Qty</label><input id=iqty type=number step=.1 value="${x.qty??0}"></div><div class=field><label>Unit</label><input id=iunit value="${esc(x.unit||"KG")}"></div><div class=field><label>Minimum</label><input id=imin type=number step=.1 value="${x.min??1}"></div><div class=span2><button class=btn onclick="saveInv(${x.id||"null"})">SAVE</button></div></div>`)}
async function saveInv(id){const v={name:iname.value.trim(),qty:+iqty.value,unit:iunit.value.trim(),min:+imin.value};if(!v.name)return toast("Item required");if(id)v.id=id;id?await DB.put("inventory",v):await DB.add("inventory",v);closeM();await refresh();render();toast("Inventory saved")}
function inventory(){return `<div class=top><h3>Inventory</h3>${S.user.role!=="member"?`<button class=btn onclick=invForm()>+ Add Item</button>`:""}</div><div class="grid three">${S.data.inventory.map(x=>`<div class=card><h3>${esc(x.name)}</h3><div class=value>${x.qty} ${esc(x.unit)}</div><span class="tag ${x.qty<=x.min?"bad":x.qty<=x.min*1.5?"warn":""}">${x.qty<=x.min?"LOW":"OK"}</span><p class=muted>Minimum ${x.min} ${esc(x.unit)}</p>${S.user.role!=="member"?`<div class=actions><button class=ghost onclick='invForm(${JSON.stringify(x)})'>Edit</button><button class="ghost danger" onclick="delRec('inventory',${x.id})">Delete</button></div>`:""}</div>`).join("")}</div>`}
function mealForm(x={}){modal(`<div class=top><h3>${x.id?"Edit":"Add"} Meal</h3><button class=ghost onclick=closeM()>✕</button></div><div class=form><div class=field><label>Slot</label><select id=mslot><option>Breakfast</option><option>Lunch</option><option>Dinner</option></select></div><div class=field><label>Date</label><input id=mdate value="${esc(x.date||"Today")}"></div><div class="field span2"><label>Menu</label><input id=mmenu value="${esc(x.menu||"")}"></div><div class=span2><button class=btn onclick="saveMeal(${x.id||"null"})">SAVE</button></div></div>`);if(x.slot)mslot.value=x.slot}
async function saveMeal(id){const v={slot:mslot.value,menu:mmenu.value.trim(),date:mdate.value.trim()};if(id)v.id=id;id?await DB.put("meals",v):await DB.add("meals",v);closeM();await refresh();render();toast("Meal saved")}
function meals(){return `<div class=top><h3>Meals</h3>${S.user.role!=="member"?`<button class=btn onclick=mealForm()>+ Add Meal</button>`:""}</div><div class="grid three">${S.data.meals.map(x=>`<div class=card><h3>${esc(x.slot)}</h3><div class=value style="font-size:20px">${esc(x.menu)}</div><span class=tag>${esc(x.date)}</span>${S.user.role!=="member"?`<div class=actions style="margin-top:12px"><button class=ghost onclick='mealForm(${JSON.stringify(x)})'>Edit</button><button class="ghost danger" onclick="delRec('meals',${x.id})">Delete</button></div>`:""}</div>`).join("")}</div>`}
function expenseForm(){modal(`<div class=top><h3>Add Expense</h3><button class=ghost onclick=closeM()>✕</button></div><div class=form><div class=field><label>Category</label><input id=ecat placeholder="Grocery"></div><div class=field><label>Amount</label><input id=eamt type=number></div><div class=field><label>Date</label><input id=edate type=date></div><div class=span2><button class=btn onclick=saveExpense()>SAVE</button></div></div>`)}
async function saveExpense(){await DB.add("expenses",{category:ecat.value.trim(),amount:+eamt.value,date:edate.value||new Date().toISOString().slice(0,10)});closeM();await refresh();render();toast("Expense saved")}
function expenses(){return `<div class=top><h3>Expenses</h3><button class=btn onclick=expenseForm()>+ Add Expense</button></div><div class="card list" style="margin-top:12px">${S.data.expenses.map(x=>`<div class=row><b>${esc(x.category)}</b><span>${esc(x.date)}</span><span>AED ${(+x.amount).toFixed(0)}</span><button class="ghost danger" onclick="delRec('expenses',${x.id})">Delete</button></div>`).join("")||`<p class=muted>No expenses yet.</p>`}</div>`}
function paymentForm(){modal(`<div class=top><h3>Add Payment</h3><button class=ghost onclick=closeM()>✕</button></div><div class=form><div class=field><label>Member</label><select id=pmember>${S.data.members.map(x=>`<option>${esc(x.name)}</option>`).join("")}</select></div><div class=field><label>Amount</label><input id=pamt type=number value=250></div><div class=field><label>Status</label><select id=pstatus><option>PAID</option><option>DUE</option></select></div><div class=field><label>Date</label><input id=pdate type=date></div><div class=span2><button class=btn onclick=savePayment()>SAVE</button></div></div>`)}
async function savePayment(){await DB.add("payments",{member:pmember.value,amount:+pamt.value,status:pstatus.value,date:pdate.value||new Date().toISOString().slice(0,10)});closeM();await refresh();render();toast("Payment saved")}
function payments(){return `<div class=top><h3>Payments</h3>${S.user.role==="admin"?`<button class=btn onclick=paymentForm()>+ Add Payment</button>`:""}</div><div class="card list" style="margin-top:12px">${S.data.payments.map(x=>`<div class=row><b>${esc(x.member)}</b><span>${esc(x.date)}</span><span>AED ${x.amount}</span><span class="tag ${x.status==="DUE"?"bad":""}">${x.status}</span></div>`).join("")||`<p class=muted>No payments yet.</p>`}</div>`}
function reports(){const total=S.data.expenses.reduce((a,b)=>a+(+b.amount||0),0);return `<div class=grid>${k("Members",S.data.members.length,"Total")}${k("Stock Items",S.data.inventory.length,"Tracked")}${k("Expenses","AED "+total.toFixed(0),"Recorded")}${k("Payments",S.data.payments.length,"Entries")}</div><div class=card style="margin-top:14px"><h3>Database Status</h3><p class=muted>IndexedDB is active inside this APK. Records persist after closing/reopening the app on the same device.</p></div>`}
function settings(){return `<div class=card><h3>Account</h3><p><b>${esc(S.user.name)}</b></p><p class=muted>${esc(S.user.email)} · ${esc(S.user.role)}</p><button class="btn danger" onclick=logout()>Logout</button></div>`}
function content(){return ({dashboard,members,meals,inventory,expenses,payments,reports,settings}[S.page]||dashboard)()}
function render(){if(!S.user)return loginUI();const p=pages();if(!p.includes(S.page))S.page="dashboard";app.innerHTML=`<div class=app><aside class=side><div class=brand>A2 MESS HUB V3</div><div class=nav>${p.map(x=>`<button class="${S.page===x?"on":""}" onclick="go('${x}')">${N[x]}</button>`).join("")}<button onclick=logout()>Logout</button></div></aside><main class=main><div class=top><div><h2>${N[S.page]}</h2><div class=muted>${esc(S.user.role.toUpperCase())} · ${esc(S.user.name)}</div></div><span class=tag>DATABASE ON</span></div>${content()}</main><div class=bottom>${p.slice(0,5).map(x=>`<button class="${S.page===x?"on":""}" onclick="go('${x}')">${N[x]}</button>`).join("")}</div></div>`}
(async()=>{await DB.open();await seed();await refresh();try{S.user=JSON.parse(sessionStorage.getItem("a2user")||"null")}catch{}render()})()
</script></body></html>
