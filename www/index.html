<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061410"><title>A2 Mess Hub V2</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:radial-gradient(circle at 20% 0,#164b3a,#04110e 40%);color:#effff8;min-height:100vh}button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box,.card{background:#09251ed9;border:1px solid #50ffad25;border-radius:22px;padding:20px;box-shadow:0 20px 60px #0005}.box{width:min(700px,100%);text-align:center}.logo{font-size:70px;font-weight:1000;color:#f5ca64;text-shadow:0 0 25px #f5ca6433}.roles,.grid{display:grid;gap:14px}.roles{grid-template-columns:repeat(3,1fr);margin:25px 0}.roles button,.btn{border:0;border-radius:16px;padding:16px;background:linear-gradient(135deg,#37f59c,#00bf72);color:#032117;font-weight:800;cursor:pointer}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:20px;background:#03140fcc;border-right:1px solid #50ffad20}.brand{font-size:20px;font-weight:900;color:#f5ca64;margin-bottom:20px}.nav button{display:block;width:100%;padding:12px;margin:6px 0;border:0;border-radius:13px;background:transparent;color:#c8e4d9;text-align:left}.nav button:hover,.nav button.on{background:#2df29318;color:#43f5a1}.main{padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:#92b3a7}.grid{grid-template-columns:repeat(4,1fr);margin-top:18px}.value{font-size:28px;font-weight:900;margin:8px 0}.three{grid-template-columns:repeat(3,1fr)}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#ffffff08;border-radius:13px}.tag{padding:5px 9px;border-radius:99px;background:#36f49a;color:#032117;font-size:11px;font-weight:900}.warn{background:#ffba50}.bad{background:#ff6671;color:white}.bar{height:8px;background:#12382d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#36f49a,#f5ca64)}.bottom{display:none}@media(max-width:800px){.app{display:block}.side{display:none}.main{padding:16px 14px 85px}.grid,.three{grid-template-columns:1fr 1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:10px;left:10px;right:10px;background:#062019ee;border:1px solid #50ffad25;padding:7px;border-radius:20px}.bottom button{border:0;background:transparent;color:#9cb9ae;padding:10px 2px}.bottom button.on{color:#3cf5a0}}@media(max-width:480px){.roles,.grid,.three{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>const S={role:localStorage.role||'',page:'dashboard',members:[['Ahmed','Premium',250,'PAID'],['Mohammed','Basic',200,'PAID'],['Rasheed','Premium',250,'DUE'],['John','Basic',200,'PAID'],['Ali','Premium',250,'PAID'],['Vijay','Basic',200,'DUE']],stock:[['Rice',18,'KG',5],['Chicken',8,'KG',3],['Onion',10,'KG',3],['Oil',6,'L',2],['Egg',60,'pcs',20]]};const names={dashboard:'Dashboard',members:'Members',meals:'Meals',inventory:'Inventory',finance:'Finance',analytics:'Analytics',whatsapp:'WhatsApp',settings:'Settings'};function login(r){S.role=r;localStorage.role=r;render()}function go(p){S.page=p;render()}function logout(){localStorage.removeItem('role');S.role='';render()}function k(l,v,s){return `<div class=card><div class=muted>${l}</div><div class=value>${v}</div><small>${s}</small></div>`}function meal(n,e,c,p){return `<div class=card><div style="font-size:35px">${e}</div><h3>${n}</h3><div class=muted>${c}</div><div class=bar><i style="width:${p}%"></i></div></div>`}function dashboard(){if(S.role==='chef')return `<div class="grid three">${meal('Breakfast','🍳','11 expected',100)}${meal('Lunch','🍛','12 expected',65)}${meal('Dinner','🥘','10 expected',25)}</div><div class=card style="margin-top:14px"><h3>Kitchen Timeline</h3><div class=list><div class=row>06:30 Breakfast <span class=tag>DONE</span></div><div class=row>11:00 Lunch <span class="tag warn">COOKING</span></div><div class=row>17:30 Dinner <span class=muted>UPCOMING</span></div></div></div>`;if(S.role==='member')return `<div class=card><div class=muted>PREMIUM MEMBER</div><div class=value>AED 250 / Month</div><span class=tag>ACTIVE</span><p>Valid until 30 Sep 2026</p></div><div class="grid three">${meal('Breakfast','🍳','Idli + Sambar',100)}${meal('Lunch','🍗','Chicken Biryani',100)}${meal('Dinner','🥘','Chapati + Curry',100)}</div>`;return `<div class=grid>${k('TOTAL MEMBERS','12','+2 this month')}${k('COLLECTION','AED 2,750','91% collected')}${k('EXPENSES','AED 1,865','This month')}${k('BALANCE','AED 885','Available')}</div><div class="grid three">${meal('Breakfast','🍳','11 / 12 completed',100)}${meal('Lunch','🍛','12 preparing',68)}${meal('Dinner','🥘','10 expected',28)}</div>`}function content(){if(S.page==='dashboard')return dashboard();if(S.page==='members')return `<div class=card><h3>Members</h3><div class=list>${S.members.map(x=>`<div class=row><span><b>${x[0]}</b><small class=muted> · ${x[1]}</small></span><span>AED ${x[2]} <b class="tag ${x[3]=='DUE'?'bad':''}">${x[3]}</b></span></div>`).join('')}</div></div>`;if(S.page==='meals')return `<div class="grid three">${meal('Breakfast','🍳','Idli + Sambar',92)}${meal('Lunch','🍗','Chicken Biryani',100)}${meal('Dinner','🥘','Chapati + Chicken Curry',83)}</div>`;if(S.page==='inventory')return `<div class="grid three">${S.stock.map(x=>`<div class=card><h3>${x[0]}</h3><div class=value>${x[1]} ${x[2]}</div><span class="tag ${x[1]<=x[3]*1.5?'warn':''}">${x[1]<=x[3]*1.5?'BUY SOON':'OK'}</span><p class=muted>Minimum ${x[3]} ${x[2]}</p></div>`).join('')}</div>`;if(S.page==='finance')return `<div class=grid>${k('COLLECTED','AED 2,750','Paid')}${k('PENDING','AED 500','Due')}${k('BUDGET','AED 2,200','Monthly')}${k('CHEF SALARY','AED 1,050','2 chefs')}</div>`;if(S.page==='analytics')return `<div class=grid>${k('PROJECTED COST','AED 2,180','Within budget')}${k('COST / MEMBER','AED 182','Estimate')}${k('MEAL CAPACITY','1,080','Monthly')}${k('WASTE RATE','6.4%','Improving')}</div><div class=card style="margin-top:14px"><h3>Smart Shopping List</h3><p>Chicken 5 KG · Oil 3 L · Onion 4 KG</p><button class=btn onclick="alert('Shopping list prepared')">Share List</button></div>`;if(S.page==='whatsapp')return `<div class=card><h3>WhatsApp Center</h3><div class=list><div class=row>Payment Reminder <button class=btn>Send</button></div><div class=row>Menu Update <button class=btn>Send</button></div><div class=row>Subscription Renewal <button class=btn>Send</button></div><div class=row>Low Stock Alert <button class=btn>Send</button></div></div></div>`;return `<div class=card><h3>A2 MESS HUB V2</h3><p>English · தமிழ் · Malayalam · Hindi</p><p class=muted>Dark Emerald UI · Notifications · Vacation Mode · Secure Roles</p><button class=btn onclick=logout()>Logout</button></div>`}function render(){if(!S.role){app.innerHTML=`<div class=login><div class=box><div class=logo>A2</div><h1>MESS HUB V2</h1><p class=muted>Eat • Track • Manage</p><div class=roles><button onclick="login('admin')">👑<br>Admin</button><button onclick="login('chef')">👨‍🍳<br>Chef</button><button onclick="login('member')">👤<br>Member</button></div><p>One Room • One Team • Better Food</p></div></div>`;return}let pages=S.role==='admin'?['dashboard','members','meals','inventory','finance','analytics','whatsapp','settings']:S.role==='chef'?['dashboard','meals','inventory','settings']:['dashboard','meals','finance','settings'];app.innerHTML=`<div class=app><aside class=side><div class=brand>A2 MESS HUB V2</div><div class=nav>${pages.map(p=>`<button class="${S.page===p?'on':''}" onclick="go('${p}')">${names[p]}</button>`).join('')}<button onclick=logout()>Logout</button></div></aside><main class=main><div class=top><div><h2>${names[S.page]||'A2 Mess Hub'}</h2><div class=muted>${S.role.toUpperCase()} CONTROL CENTER</div></div><span class=tag>LIVE</span></div>${content()}</main><div class=bottom>${pages.slice(0,5).map(p=>`<button class="${S.page===p?'on':''}" onclick="go('${p}')">${names[p]}</button>`).join('')}</div></div>`}render();</script></body></html>
