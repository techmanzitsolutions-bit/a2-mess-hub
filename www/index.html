<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a9b68">
  <title>A2 MESS HUB</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;color:#17352c;background:radial-gradient(circle at 88% 4%,rgba(10,155,104,.15),transparent 32%),radial-gradient(circle at 5% 95%,rgba(10,155,104,.08),transparent 28%),#f4f8f6}.wrap{text-align:center;padding:24px}.badge{width:92px;height:92px;margin:0 auto 20px;display:grid;place-items:center;border-radius:27px;background:linear-gradient(145deg,#0a9b68,#087b55);color:#fff;font-size:36px;font-weight:950;box-shadow:0 20px 45px rgba(10,155,104,.23);animation:enter .65s cubic-bezier(.2,.9,.2,1) both}.name{font-size:27px;font-weight:900;letter-spacing:.03em}.name span{color:#0a9b68}.tag{margin-top:8px;color:#71867f;font-size:12px;letter-spacing:.12em}.loader{width:150px;height:5px;margin:24px auto 0;overflow:hidden;border-radius:99px;background:#dcebe5}.loader::after{content:"";display:block;width:55%;height:100%;border-radius:99px;background:#0a9b68;animation:load 1.15s ease-in-out infinite}.tech{position:fixed;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));text-align:center;color:#71867f;font-size:11px;font-weight:700;letter-spacing:.08em}@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.88)}to{opacity:1;transform:none}}@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(200%)}}@media(prefers-reduced-motion:reduce){.badge,.loader::after{animation:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="badge">A2</div>
    <div class="name">A2 MESS <span>HUB</span></div>
    <div class="tag">SMART MESS MANAGEMENT</div>
    <div class="loader" aria-hidden="true"></div>
  </main>
  <div class="tech">POWERED BY TECHMANZ</div>
  <script>setTimeout(()=>location.replace('./app.html'),900)</script>
</body>
</html>
