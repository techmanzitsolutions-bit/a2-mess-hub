splay:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.three{grid-template-columns:repeat(3,1fr)}.card{padding:16px}.metric{font-size:28px;font-weight:1000;margin-top:6px}.muted{color:#91b4a7}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:1.4fr .8fr .8fr auto;gap:8px;align-items:center;background:#ffffff06;padding:11px;border-radius:13px}.tag{display:inline-block;border-radius:99px;padding:5px 8px;background:#44e99d;color:#042016;font-size:11px;font-weight:900}.tag.due{background:#ed6672;color:#fff}.actions{display:flex;gap:6px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:15px;z-index:20}.modal>.card{width:min(650px,100%);max-height:90vh;overflow:auto}.toast{position:fixed;right:15px;bottom:15px;background:#10412f;border:1px solid #66efb63b;padding:12px 15px;border-radius:13px;z-index:99}.bottom{display:none}.billimg{width:92px;height:92px;object-fit:cover;border-radius:12px;border:1px solid #62efb43b;margin-top:7px;background:#02100c}.billpreview{display:none;margin-top:10px;padding:10px;border:1px dashed #67efb644;border-radius:14px;background:#ffffff05}.billpreview.show{display:block}.billpreview img{display:block;width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:#020907}.pickers{display:flex;gap:8px;flex-wrap:wrap}.pickers .ghost{flex:1;min-width:130px}.uploadstatus{margin-top:8px;font-size:12px;color:#9ec4b5}.filehide{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.billlink{display:inline-block;margin-top:7px;color:#f6cb67;text-decoration:none;font-size:12px;font-weight:800}.note{padding:10px 12px;border-radius:12px;background:#f6cb6710;border:1px solid #f6cb6730;color:#ffe7a7}.ok{padding:10px 12px;border-radius:12px;background:#45f0a611;border:1px solid #45f0a633;color:#b9ffdc}@media(max-width:900px){.app{display:block}.side{display:none}.main{padding:14px 11px 84px}.grid,.three{grid-template-columns:1fr 1fr}.bottom{display:flex;overflow-x:auto;position:fixed;left:7px;right:7px;bottom:7px;background:#061e17f7;border:1px solid #68eeb62c;border-radius:18px;padding:6px;z-index:10}.bottom button{min-width:74px;border:0;background:transparent;color:#93b4a8;padding:8px 5px;font-size:10px}.bottom button.on{color:#4bf2aa}.row{grid-template-columns:1.2fr .7fr auto}.hide-sm{display:none}}@media(max-width:560px){.form,.grid,.three{grid-template-columns:1fr}.span2{grid-column:auto}.row{grid-template-columns:1fr auto}}

<div id="app"><div class="center"><div class="panel"><div class="steam">♨️ 🍲 ♨️</div><div class="logo">A2</div><h1 class="title">MESS HUB</h1><p class="sub">Eat • Track • Manage • Sync</p><p class="powered">⚡ POWERED BY TECHMANZ</p><p class="sub">Connecting to cloud…</p></div></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js';
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut}from'https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc,collection,onSnapshot,addDoc,updateDoc,deleteDoc,serverTimestamp,writeBatch}from'https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDOUJGSLfDrmmc74YUGRkDU1b4P2gYmGyU',authDomain:'a2-mess-hub.firebaseapp.com',projectId:'a2-mess-hub',storageBucket:'a2-mess-hub.firebasestorage.app',messagingSenderId:'451214844236',appId:'1:451214844236:android:546b7783ecf04e40af6fe9'};
const DEFAULT_UPLOADCARE_KEY='002716e9054a6ef05d45';
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),creatorApp=initializeApp(firebaseConfig,'creator'),creatorAuth=getAuth(creatorApp),appEl=document.getElementById('app');
const state={profile:null,page:'dashboard',config:{},data:{members:[],inventory:[],meals:[],expenses:[],payments:[],users:[]},unsubs:[]};
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(m){let x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2800)}
function err(e){console.error(e);toast((e?.message||String(e)).replace('Firebase: ',''))}
function modal(h){document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal"><div class="card">${h}</div></div>`)}
window.closeM=()=>$('modal')?.remove();
function ask(msg){return confirm(msg)}
async function systemReady(){try{return(await getDoc(doc(db,'system','config'))).exists()}catch{return true}}
async function showAuth(){const ready=await systemReady();appEl.innerHTML=`<div class=center><div class=panel><div class=steam>♨️ 🍲 ♨️</div><div class=logo>A2</div><h1 class=title>MESS HUB</h1><p class=sub>Cloud synchronized mess management</p>${ready?`<div class=form><div class="field span2"><label>Email</label><input id=email type=email></div><div class="field span2"><label>Password</label><input id=pass type=password></div><div class=span2><button class=btn id=loginBtn>LOGIN</button></div></div><p class=sub>No public signup. Accounts are created by Admin.</p>`:`<h3>Owner Setup</h3><div class=form><div class=field><label>Name</label><input id=ownerName></div><div class=field><label>Email</label><input id=ownerEmail type=email></div><div class="field span2"><label>Password (8+)</label><input id=ownerPass type=password></div><div class=span2><button class=btn id=ownerBtn>CREATE OWNER ADMIN</button></div></div>`}<p class=powered>⚡ POWERED BY TECHMANZ</p></div></div>`;if(ready)$('loginBtn').onclick=login;else $('ownerBtn').onclick=bootstrapOwner}
async function bootstrapOwner(){try{const name=$('ownerName').value.trim(),email=$('ownerEmail').value.trim().toLowerCase(),password=$('ownerPass').value;if(!name||!email||password.length<8)return toast('Enter valid owner details');const c=await createUserWithEmailAndPassword(auth,email,password),b=writeBatch(db);b.set(doc(db,'users',c.user.uid),{uid:c.user.uid,name,email,role:'admin',active:true,createdAt:serverTimestamp()});b.set(doc(db,'system','config'),{ownerUid:c.user.uid,ownerEmail:email,initialized:true,imageProvider:'uploadcare',uploadcarePublicKey:DEFAULT_UPLOADCARE_KEY,createdAt:serverTimestamp()});await b.commit();toast('Owner Admin created')}catch(e){err(e)}}
async function login(){try{await signInWithEmailAndPassword(auth,$('email').value.trim().toLowerCase(),$('pass').value)}catch(e){err(e)}}
window.logout=()=>signOut(auth);
function listen(){state.unsubs.forEach(f=>f());state.unsubs=[];state.unsubs.push(onSnapshot(doc(db,'system','config'),s=>{state.config=s.data()||{};render()}));['members','inventory','meals','expenses','payments'].forEach(c=>state.unsubs.push(onSnapshot(collection(db,c),s=>{state.data[c]=s.docs.map(d=>({id:d.id,...d.data()}));render()})));if(state.profile.role==='admin')state.unsubs.push(onSnapshot(collection(db,'users'),s=>{state.data.users=s.docs.map(d=>({id:d.id,...d.data()}));render()}))}
const nav=()=>state.profile.role==='admin'?['dashboard','users','members','meals','inventory','expenses','payments','reports','settings']:state.profile.role==='chef'?['dashboard','meals','inventory','expenses','settings']:['dashboard','meals','payments','settings'];
const label={dashboard:'Dashboard',users:'Users',members:'Members',meals:'Meals',inventory:'Inventory',expenses:'Expenses',payments:'Payments',reports:'Reports',settings:'Settings'};
function metric(t,v){return`<div class=card><div class=muted>${t}</div><div class=metric>${v}</div></div>`}
function layout(body){const n=nav();appEl.innerHTML=`<div class=app><aside class=side><div class=brand>A2 MESS HUB</div><div class=small>${esc(state.profile.name)} · ${esc(state.profile.role.toUpperCase())}</div><div class=nav>${n.map(x=>`<button class="${state.page===x?'on':''}" onclick="go('${x}')">${label[x]}</button>`).join('')}</div><p class=powered style="margin-top:28px">⚡ TECHMANZ</p></aside><main class=main><div class=top><div><h2 style="margin:0">${label[state.page]}</h2><div class=small>Realtime cloud sync</div></div><button class=ghost onclick=logout()>Logout</button></div>${body}</main></div><nav class=bottom>${n.map(x=>`<button class="${state.page===x?'on':''}" onclick="go('${x}')">${label[x]}</button>`).join('')}</nav>`}
window.go=p=>{state.page=p;render()};
function dashboard(){const paid=state.data.payments.reduce((a,x)=>a+(x.status==='PAID'?Number(x.amount||0):0),0),exp=state.data.expenses.reduce((a,x)=>a+Number(x.amount||0),0);return`<div class=grid>${metric('Members',state.data.members.length)}${metric('Collected','AED '+paid.toFixed(0))}${metric('Expenses','AED '+exp.toFixed(0))}${metric('Balance','AED '+(paid-exp).toFixed(0))}</div>`}
function users(){return`<div class=top style="margin-top:14px"><p class=muted>Admin creates Member/Chef accounts.</p><button class=btn onclick=userForm()>+ Create User</button></div><div class="card list">${state.data.users.map(u=>`<div class=row><span><b>${esc(u.name)}</b><small class=muted> · ${esc(u.email)}</small></span><span>${esc(u.role)}</span><span>${u.active===false?'Disabled':'Active'}</span><span>${u.role!=='admin'?`<div class=actions><button class=ghost onclick="editUser('${u.id}')">Edit</button><button class=ghost onclick="toggleUser('${u.id}',${u.active===false})">${u.active===false?'Enable':'Disable'}</button><button class="ghost danger" onclick="removeUserProfile('${u.id}')">Remove</button></div>`:''}</span></div>`).join('')}</div><div class=note style="margin-top:12px">Removing a user profile blocks app access but does not delete the Firebase Authentication login on Spark.</div>`}
window.userForm=(u={})=>modal(`<div class=top><h3>${u.id?'Edit':'Create'} User</h3><button class=ghost onclick=closeM()>✕</button></div><div class=form><div class=field><label>Name</label><input id=uname value="${esc(u.name||'')}"></div><div class=field><label>Role</label><select id=urole><option value=member ${u.role==='member'?'selected':''}>Member</option><option value=chef ${u.role==='chef'?'selected':''}>Chef</option></select></div>${u.id?'':`<div class="field span2"><label>Email</label><input id=uemail type=email></div><div class="field span2"><label>Temporary Password (6+)</label><input id=upass type=password></div>`}<div class=span2><button class=btn onclick="saveUser('${u.id||''}')">SAVE</button></div></div>`);
window.editUser=id=>userForm(state.data.users.find(x=>x.id===id)||{});
window.saveUser=async id=>{try{const name=$('uname').value.trim(),role=$('urole').value;if(!name)return toast('Enter name');if(id){await updateDoc(doc(db,'users',id),{name,role,updatedAt:serverTimestamp()});const m=await getDoc(doc(db,'members',id));if(role==='member'&&m.exists())await updateDoc(doc(db,'members',id),{name,updatedAt:serverTimestamp()});closeM();return toast('User updated')}const email=$('uemail').value.trim().toLowerCase(),password=$('upass').value;if(!email||password.length<6)return toast('Enter valid email/password');const c=await createUserWithEmailAndPassword(creatorAuth,email,password);await signOut(creatorAuth);const b=writeBatch(db);b.set(doc(db,'users',c.user.uid),{uid:c.user.uid,name,email,role,active:true,createdBy:auth.currentUser.uid,createdAt:serverTimestamp()});if(role==='member')b.set(doc(db,'members',c.user.uid),{uid:c.user.uid,name,email,plan:'AED 200',status:'DUE',active:true,createdAt:serverTimestamp()});await b.commit();closeM();toast('User created')}catch(e){try{await signOut(creatorAuth)}catch{}err(e)}};
window.toggleUser=async(id,isDisabled)=>{try{await updateDoc(doc(db,'users',id),{active:isDisabled,updatedAt:serverTimestamp()});const m=await getDoc(doc(db,'members',id));if(m.exists())await updateDoc(doc(db,'members',id),{active:isDisabled,updatedAt:serverTimestamp()});toast(isDisabled?'User enabled':'User disabled')}catch(e){err(e)}};
window.removeUserProfile=async id=>{if(!ask('Remove this user profile? The Firebase Auth login will remain, but app access will stop.'))return;try{const b=writeBatch(db);b.delete(doc(db,'users',id));b.delete(doc(db,'members',id));await b.commit();toast('User profile removed')}catch(e){err(e)}};
window.resetUser=async email=>{try{await sendPasswordResetEmail(auth,email);toast('Password reset email sent')}catch(e){err(e)}};
function members(){return`<div class=top style="margin-top:14px"><p class=muted>Subscription members</p>${state.profile.role==='admin'?'<button class=btn onclick=memberForm()>+ Member Record</button>':''}</div><div class="card list">${state.data.members.map(x=>`<div class=row><span><b>${esc(x.name)}</b></span><span>${esc(x.plan||'-')}</span><span class="tag ${x.status==='DUE'?'due':''}">${esc(x.status||'DUE')}</span><span>${state.profile.role==='admin'?`<div class=actions><button class=ghost onclick="memberFormById('${x.id}')">Edit</button><button class="ghost danger" onclick="delRecord('members','${x.id}','member')">Delete</button></div>`:''}</span></div>`).join('')}</div>`}
window.memberForm=(x={})=>modal(`<div class=top><h3>Member</h3><button class=ghost onclick=closeM()>✕</button></div><div class=form><div class=field><label>Name</label><input id=mname value="${esc(x.name||'')}"></div><div class=field><label>Plan</label><select id=mplan><option ${x.plan!=='AED 250'?'selected':''}>AED 200</option><option ${x.plan==='AED 250'?'selected':''}>AED 250</option></select></div><div class=field><label>Status</label><select id=mstatus><option ${x.status==='PAID'?'selected':''}>PAID</option><option ${x.status!=='PAID'?'selected':''}>DUE</option></select></div><div class=field><label>Phone</label><input id=mphone value="${esc(x.phone||'')}"></div><div class=span2><button class=btn onclick="saveMember('${x.id||''}')">SAVE</button></div></div>`);
window.memberFormById=id=>memberForm(state.data.members.find(x=>x.id===id)||{});
window.saveMember=async id=>{try{const v={name:$('mname').value.trim(),plan:$('mplan').value,status:$('mstatus').value,phone:$('mphone').value.trim(),updatedAt:serverTimestamp()};id?await updateDoc(doc(db,'members',id),v):await addDoc(collection(db,'members'),{...v,createdAt:serverTimestamp()});closeM();toast('Member saved')}catch(e){err(e)}};
function meals(){return`<div class=top style="margin-top:14px"><p class=muted>Live menu</p>${state.profile.role!=='member'?'<button class=btn onclick=mealForm()>+ Meal</button>':''}</div><div class="card list">${state.data.meals.map(x=>`<div class=row><span><b>${esc(x.slot)}</b><small class=muted> · ${esc(x.menu)}</small></span><span>${esc(x.date||'')}</span><span></span><span>${state.profile.role==='admin'?`<div class=actions><button class=ghost onclick="mealFormById('${x.id}')">Edit</button><button class="ghost danger" onclick="delRecord('meals','${x.id}','meal')">Delete</button></div>`:''}</span></div>`).join('')}</div>`}
window.mealForm=(x={})=>modal(`<div class=top><h3>${x.id?'Edit':'Add'} Meal</h3><button class=ghost onclick=closeM()>✕</button></div><div class=form><div class=field><label>Slot</label><select id=mslot><option ${x.slot==='Breakfast'?'selected':''}>Breakfast</option><option ${x.slot==='Lunch'?'selected':''}>Lunch</option><option ${x.slot==='Dinner'?'selected':''}>Dinner</option></select></div><div class=field><label>Date</label><input id=mdate type=date value="${esc(x.date||'')}"></div><div class="field span2"><label>Menu</label><input id=mmenu value="${esc(x.menu||'')}"></div><div class=span2><button class=btn onclick="saveMeal('${x.id||''}')">SAVE</button></div></div>`);
window.mealFormById=id=>mealForm(state.data.meals.find(x=>x.id===id)||{});
window.saveMeal=async id=>{try{const v={slot:$('mslot').value,date:$('mdate').value,menu:$('mmenu').value.trim(),updatedAt:serverTimestamp()};id?await updateDoc(doc(db,'meals',id),v):await addDoc(collection(db,'meals'),{...v,createdAt:serverTimestamp()});closeM();toast('Meal saved')}catch(e){err(e)}};
function inventory(){return`<div class=top style="margin-top:14px"><p class=muted>Shared stock</p>${state.profile.role!=='member'?'<button class=btn onclick=invForm()>+ Stock</button>':''}</div><div class="card list">${state.data.inventory.map(x=>`<div class=row><span><b>${esc(x.name)}</b></span><span>${Number(x.qty||0)} ${esc(x.unit||'')}</span><span class="tag ${Number(x.qty||0)<=Number(x.min||0)?'due':''}">${Number(x.qty||0)<=Number(x.min||0)?'LOW':'OK'}</span><span>${state.profile.role==='admin'?`<div class=actions><button class=ghost onclick="invFormById('${x.id}')">Edit</button><button class="ghost danger" onclick="delRecord('inventory','${x.id}','stock item')">Delete</button></div>`:''}</span></div>`).join('')}</div>`}
window.invForm=(x={})=>modal(`<div class=top><h3>${x.id?'Edit':'Add'} Stock</h3><button class=ghost onclick=closeM()>✕</button></div><div class=form><div class=field><label>Item</label><input id=iname value="${esc(x.name||'')}"></div><div class=field><label>Qty</label><input id=iqty type=number step=.1 value="${esc(x.qty??'')}"></div><div class=field><label>Unit</label><input id=iunit value="${esc(x.unit||'KG')}"></div><div class=field><label>Minimum</label><input id=imin type=number step=.1 value="${esc(x.min??1)}"></div><div class=span2><button class=btn onclick="saveInv('${x.id||''}')">SAVE</button></div></div>`);
window.invFormById=id=>invForm(state.data.inventory.find(x=>x.id===id)||{});
window.saveInv=async id=>{try{const v={name:$('iname').value.trim(),qty:Number($('iqty').value),unit:$('iunit').value,min:Number($('imin').value),updatedAt:serverTimestamp()};id?await updateDoc(doc(db,'inventory',id),v):await addDoc(collection(db,'inventory'),{...v,createdAt:serverTimestamp()});closeM();toast('Inventory saved')}catch(e){err(e)}};
async function compressImage(file){const url=URL.createObjectURL(file);try{const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=url});const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Could not process photo')),'image/jpeg',.78))}finally{URL.revokeObjectURL(url)}}
async function uploadBill(file){const key=(state.config.uploadcarePublicKey||DEFAULT_UPLOADCARE_KEY).trim();if(!key)throw new Error('Uploadcare Public Key is missing');const blob=await compressImage(file),fd=new FormData();fd.append('UPLOADCARE_PUB_KEY',key);fd.append('UPLOADCARE_STORE','auto');fd.append('file',blob,'bill.jpg');const res=await fetch('https://upload.uploadcare.com/base/',{method:'POST',body:fd});if(!res.ok){let detail='';try{detail=await res.text()}catch{}throw new Error('Photo upload failed ('+res.status+')'+(detail?' '+detail.slice(0,100):''))}const j=await res.json(),uuid=j.file||Object.values(j).find(v=>typeof v==='string'&&v.length>10);if(!uuid)throw new Error('Upload completed but no photo ID returned');return{billUrl:`https://ucarecdn.com/${uuid}/`,billFileId:uuid}}
window.pickExpensePhoto=source=>{const el=$(source==='camera'?'ebillCamera':'ebillGallery');if(el)el.click()};
window.previewExpensePhoto=input=>{try{const file=input?.files?.[0];if(!file)return;const other=input.id==='ebillCamera'?$('ebillGallery'):$('ebillCamera');if(other)other.value='';const img=$('billPreviewImg'),box=$('billPreview'),status=$('uploadStatus');if(img.dataset.objectUrl)URL.revokeObjectURL(img.dataset.objectUrl);const url=URL.createObjectURL(file);img.dataset.objectUrl=url;img.src=url;box.classList.add('show');status.textContent=`Selected: ${file.name||'Bill photo'} · ${(file.size/1024/1024).toFixed(2)} MB`;status.style.color='#b9ffdc'}catch(e){err(e)}};
window.billImageError=img=>{img.style.display='none';const a=img.parentElement;if(a){a.textContent='View Bill Photo';a.className='billlink'}};
function expenses(){return`<div class=top style="margin-top:14px"><p class=muted>Bill photos sync live using Uploadcare</p><button class=btn onclick=expenseForm()>+ Expense</button></div><div class="card list">${state.data.expenses.map(x=>`<div class=row><span><b>${esc(x.title)}</b>${x.billUrl?`<br><a href="${esc(x.billUrl)}" target=_blank rel=noopener><img class=billimg src="${esc(x.billUrl)}-/preview/300x300/" alt="Bill photo" onerror="billImageError(this)"></a><br><a class=billlink href="${esc(x.billUrl)}" target=_blank rel=noopener>View Bill</a>`:''}</span><span>AED ${Number(x.amount||0).toFixed(2)}</span><span>${esc(x.category||'General')}</span><span>${state.profile.role==='admin'?`<div class=actions><button class=ghost onclick="expenseFormById('${x.id}')">Edit</button><button class="ghost danger" onclick="delRecord('expenses','${x.id}','expense')">Delete</button></div>`:''}</span></div>`).join('')}</div>`}
window.expenseForm=(x={})=>{modal(`<div class=top><h3>${x.id?'Edit':'Add'} Expense</h3><button class=ghost onclick=closeM()>✕</button></div><div class=form><div class=field><label>Title</label><input id=etitle value="${esc(x.title||'')}"></div><div class=field><label>Amount</label><input id=eamount type=number step=.01 value="${esc(x.amount??'')}"></div><div class=field><label>Category</label><input id=ecat value="${esc(x.category||'Grocery')}"></div><div class="field span2"><label>Bill photo</label><div class=pickers><button type=button class=ghost onclick="pickExpensePhoto('camera')">📷 Camera</button><button type=button class=ghost onclick="pickExpensePhoto('gallery')">🖼️ Gallery</button></div><input class=filehide id=ebillCamera type=file accept="image/*" capture=environment onchange="previewExpensePhoto(this)"><input class=filehide id=ebillGallery type=file accept="image/*" onchange="previewExpensePhoto(this)"><div id=billPreview class="billpreview ${x.billUrl?'show':''}"><img id=billPreviewImg src="${esc(x.billUrl?x.billUrl+'-/preview/800x800/':'')}" alt="Selected bill photo"><div id=uploadStatus class=uploadstatus>${x.billUrl?'Current bill photo — choose Camera or Gallery to replace it.':'Choose Camera or Gallery. Photo preview will appear here.'}</div></div></div><div class=span2><button id=expenseSaveBtn class=btn onclick="saveExpense('${x.id||''}')">UPLOAD & SAVE</button></div></div>`)};
window.expenseFormById=id=>expenseForm(state.data.expenses.find(x=>x.id===id)||{});
window.saveExpense=async id=>{const btn=$('expenseSaveBtn'),status=$('uploadStatus');try{const old=state.data.expenses.find(x=>x.id===id)||{},title=$('etitle').value.trim(),amount=Number($('eamount').value);if(!title||!amount)return toast('Enter title and amount');let billUrl=old.billUrl||'',billFileId=old.billFileId||'';const f=$('ebillCamera')?.files?.[0]||$('ebillGallery')?.files?.[0];if(btn){btn.disabled=true;btn.textContent=f?'UPLOADING PHOTO…':'SAVING…'}if(f){if(status){status.textContent='Uploading bill photo…';status.style.color='#f6cb67'}({billUrl,billFileId}=await uploadBill(f));if(status){status.textContent='Uploaded ✅ Saving expense…';status.style.color='#b9ffdc'}}const v={title,amount,category:$('ecat').value.trim(),billUrl,billFileId,imageProvider:billUrl?'uploadcare':'',updatedAt:serverTimestamp()};id?await updateDoc(doc(db,'expenses',id),v):await addDoc(collection(db,'expenses'),{...v,createdBy:auth.currentUser.uid,createdAt:serverTimestamp()});closeM();toast(f?'Expense & photo saved ✅':'Expense saved ✅')}catch(e){if(status){status.textContent='Upload failed — '+(e?.message||e);status.style.color='#ffb7bd'}err(e)}finally{if(btn){btn.disabled=false;btn.textContent='UPLOAD & SAVE'}}};
function payments(){const rows=state.profile.role==='member'?state.data.payments.filter(x=>x.uid===auth.currentUser.uid):state.data.payments;return`<div class=top style="margin-top:14px"><p class=muted>Payment status</p>${state.profile.role==='admin'?'<button class=btn onclick=paymentForm()>+ Payment</button>':''}</div><div class="card list">${rows.map(x=>`<div class=row><span><b>${esc(x.name||'Member')}</b></span><span>AED ${Number(x.amount||0)}</span><span class="tag ${x.status==='DUE'?'due':''}">${esc(x.status||'DUE')}</span><span>${state.profile.role==='admin'?`<div class=actions><button class=ghost onclick="paymentFormById('${x.id}')">Edit</button><button class=ghost onclick="wa('${esc(x.phone||'')}','${esc(x.name||'Member')}','${Number(x.amount||0)}')">WhatsApp</button><button class="ghost danger" onclick="delRecord('payments','${x.id}','payment')">Delete</button></div>`:''}</span></div>`).join('')}</div>`}
window.paymentForm=(x={})=>modal(`<div class=top><h3>${x.id?'Edit':'Add'} Payment</h3><button class=ghost onclick=closeM()>✕</button></div><div class=form><div class=field><label>Member</label><select id=puid><option value="">Manual / Not linked</option>${state.data.members.map(m=>`<option value="${m.uid||m.id}" ${(x.uid===(m.uid||m.id))?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class=field><label>Name</label><input id=pname value="${esc(x.name||'')}"></div><div class=field><label>Phone</label><input id=pphone value="${esc(x.phone||'')}" placeholder="9715..."></div><div class=field><label>Amount</label><input id=pamount type=number value="${esc(x.amount??'')}"></div><div class=field><label>Status</label><select id=pstatus><option ${x.status==='PAID'?'selected':''}>PAID</option><option ${x.status==='DUE'?'selected':''}>DUE</option></select></div><div class=span2><button class=btn onclick="savePayment('${x.id||''}')">SAVE</button></div></div>`);
window.paymentFormById=id=>paymentForm(state.data.payments.find(x=>x.id===id)||{});
window.savePayment=async id=>{try{const v={uid:$('puid').value,name:$('pname').value.trim(),phone:$('pphone').value.trim(),amount:Number($('pamount').value),status:$('pstatus').value,updatedAt:serverTimestamp()};id?await updateDoc(doc(db,'payments',id),v):await addDoc(collection(db,'payments'),{...v,createdAt:serverTimestamp()});closeM();toast('Payment saved')}catch(e){err(e)}};
window.wa=(phone,name,amount)=>{const text=encodeURIComponent(`A2 MESS HUB\
Hi ${name}, current mess payment status: AED ${amount}.\
— Powered by TECHMANZ`);window.open(`https://wa.me/${phone.replace(/\D/g,'')}?text=${text}`,'_blank')};
window.delRecord=async(col,id,label)=>{if(!ask(`Delete this ${label}? This cannot be undone.`))return;try{await deleteDoc(doc(db,col,id));toast(label+' deleted')}catch(e){err(e)}};
function reports(){const paid=state.data.payments.reduce((a,x)=>a+(x.status==='PAID'?Number(x.amount||0):0),0),exp=state.data.expenses.reduce((a,x)=>a+Number(x.amount||0),0);return`<div class="grid three">${metric('Income','AED '+paid.toFixed(2))}${metric('Expense','AED '+exp.toFixed(2))}${metric('Net','AED '+(paid-exp).toFixed(2))}</div>`}
function settings(){return`<div class=card style="margin-top:14px"><h3>A2 MESS HUB</h3><p class=muted>Project: a2-mess-hub<br>Package: com.a2messhub.app<br>Role: ${esc(state.profile.role)}</p>${state.profile.role==='admin'?`<hr style="border-color:#ffffff14"><h3>Live Bill Photo Storage</h3><div class=ok>✅ Uploadcare live photo storage enabled.</div><div class=form style="margin-top:12px"><div class="field span2"><label>Uploadcare Public Key</label><input id=uckey value="${esc(state.config.uploadcarePublicKey||DEFAULT_UPLOADCARE_KEY)}"></div><div class=span2><button class=btn onclick=savePhotoSettings()>SAVE PHOTO STORAGE</button></div></div>`:''}<p class=powered>⚡ POWERED BY TECHMANZ</p></div>`}
window.savePhotoSettings=async()=>{try{const key=$('uckey').value.trim();if(!key)return toast('Enter Uploadcare Public Key');await setDoc(doc(db,'system','config'),{uploadcarePublicKey:key,imageProvider:'uploadcare',updatedAt:serverTimestamp()},{merge:true});toast('Photo storage configured')}catch(e){err(e)}};
function render(){if(!state.profile)return;let body='';try{body=({dashboard,users,members,meals,inventory,expenses,payments,reports,settings}[state.page]||dashboard)()}catch(e){body=`<div class=card><h3>Page error</h3><p>${esc(e.message)}</p></div>`}layout(body)}
onAuthStateChanged(auth,async u=>{state.unsubs.forEach(f=>f());state.unsubs=[];state.profile=null;if(!u){setTimeout(showAuth,250);return}try{const p=await getDoc(doc(db,'users',u.uid));if(!p.exists()){await signOut(auth);return toast('Account has no assigned role. Contact Admin.')}state.profile={uid:u.uid,...p.data()};if(state.profile.active===false){await signOut(auth);return toast('Account disabled')}state.page='dashboard';listen();render()}catch(e){err(e);await signOut(auth)}});
</script>
</body>
</html>
