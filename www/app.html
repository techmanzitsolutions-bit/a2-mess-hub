itmap(file),max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);return await new Promise(r=>canvas.toBlob(r,'image/jpeg',.76))}async function uploadBill(file){const key=(state.config.uploadcarePublicKey||'').trim();if(!key)throw new Error('Admin must add Uploadcare Public Key in Settings');const blob=await compressImage(file),fd=new FormData();fd.append('UPLOADCARE_PUB_KEY',key);fd.append('UPLOADCARE_STORE','1');fd.append('file',blob,'bill.jpg');const res=await fetch('https://upload.uploadcare.com/base/',{method:'POST',body:fd});if(!res.ok)throw new Error('Photo upload failed ('+res.status+')');const j=await res.json(),uuid=j.file||Object.values(j)[0];if(!uuid)throw new Error('Uploadcare did not return file ID');return{billUrl:`https://ucarecdn.com/${uuid}/-/preview/1600x1600/`,billFileId:uuid}}function expenses(){return`<div class=top style="margin-top:14px"><p class=muted>Bill photos sync live using Uploadcare</p><button class=btn onclick=expenseForm()>+ Expense</button></div>${!state.config.uploadcarePublicKey?'<div class=note style="margin:12px 0">Photo cloud is not configured yet. Admin → Settings → add Uploadcare Public Key.</div>':''}<div class="card list">${state.data.expenses.map(x=>`<div class=row><span><b>${esc(x.title)}</b>${x.billUrl?`<br><a href="${esc(x.billUrl)}" target=_blank><img class=billimg src="${esc(x.billUrl)}" alt="Bill"></a>`:''}</span><span>AED ${Number(x.amount||0).toFixed(2)}</span><span>${esc(x.category||'General')}</span><span>${x.billUrl?'<span class=tag>LIVE PHOTO</span>':''}</span></div>`).join('')}</div>`}window.expenseForm=()=>modal(`<div class=top><h3>Add Expense</h3><button class=ghost onclick=closeM()>✕</button></div><div class=form><div class=field><label>Title</label><input id=etitle></div><div class=field><label>Amount</label><input id=eamount type=number step=.01></div><div class=field><label>Category</label><input id=ecat value=Grocery></div><div class=field><label>Bill photo</label><input id=ebill type=file accept="image/*" capture=environment></div><div class=span2><button class=btn onclick=saveExpense()>UPLOAD & SAVE</button></div></div>`);window.saveExpense=async()=>{try{const title=$('etitle').value.trim(),amount=Number($('eamount').value);if(!title||!amount)return toast('Enter title and amount');let billUrl='',billFileId='';const f=$('ebill').files[0];if(f){toast('Compressing & uploading photo…');({billUrl,billFileId}=await uploadBill(f))}await addDoc(collection(db,'expenses'),{title,amount,category:$('ecat').value.trim(),billUrl,billFileId,imageProvider:billUrl?'uploadcare':'',createdBy:auth.currentUser.uid,createdAt:serverTimestamp()});closeM();toast('Expense saved & synced')}catch(e){err(e)}};function payments(){const rows=state.profile.role==='member'?state.data.payments.filter(x=>x.uid===auth.currentUser.uid):state.data.payments;return`<div class=top style="margin-top:14px"><p class=muted>Payment status</p>${state.profile.role==='admin'?'<button class=btn onclick=paymentForm()>+ Payment</button>':''}</div><div class="card list">${rows.map(x=>`<div class=row><span><b>${esc(x.name||x.uid||'Member')}</b></span><span>AED ${Number(x.amount||0)}</span><span class="tag ${x.status==='DUE'?'due':''}">${esc(x.status||'DUE')}</span><span>${state.profile.role==='admin'?`<button class=ghost onclick="wa('${esc(x.phone||'')}','${esc(x.name||'Member')}','${Number(x.amount||0)}')">WhatsApp</button>`:''}</span></div>`).join('')}</div>`}window.paymentForm=()=>modal(`<div class=top><h3>Add Payment</h3><button class=ghost onclick=closeM()>✕</button></div><div class=form><div class=field><label>Member</label><select id=puid><option value="">Manual / Not linked</option>${state.data.members.map(m=>`<option value="${m.uid||m.id}">${esc(m.name)}</option>`).join('')}</select></div><div class=field><label>Name</label><input id=pname></div><div class=field><label>Phone</label><input id=pphone placeholder="9715..."></div><div class=field><label>Amount</label><input id=pamount type=number></div><div class=field><label>Status</label><select id=pstatus><option>PAID</option><option>DUE</option></select></div><div class=span2><button class=btn onclick=savePayment()>SAVE</button></div></div>`);window.savePayment=async()=>{try{await addDoc(collection(db,'payments'),{uid:$('puid').value,name:$('pname').value.trim(),phone:$('pphone').value.trim(),amount:Number($('pamount').value),status:$('pstatus').value,createdAt:serverTimestamp()});closeM()}catch(e){err(e)}};window.wa=(phone,name,amount)=>{const text=encodeURIComponent(`A2 MESS HUB\nHi ${name}, current mess payment status: AED ${amount}. Please contact admin for details.\n— Powered by TECHMANZ`);window.open(`https://wa.me/${phone.replace(/\D/g,'')}?text=${text}`,'_blank')};function reports(){const paid=state.data.payments.reduce((a,x)=>a+(x.status==='PAID'?Number(x.amount||0):0),0),exp=state.data.expenses.reduce((a,x)=>a+Number(x.amount||0),0);return`<div class="grid three">${metric('Income','AED '+paid.toFixed(2))}${metric('Expense','AED '+exp.toFixed(2))}${metric('Net','AED '+(paid-exp).toFixed(2))}</div>`}function settings(){return`<div class=card style="margin-top:14px"><h3>A2 MESS HUB</h3><p class=muted>Project: a2-mess-hub<br>Package: com.a2messhub.app<br>Role: ${esc(state.profile.role)}</p>${state.profile.role==='admin'?`<hr style="border-color:#ffffff14"><h3>Live Bill Photo Storage</h3><p class=muted>Provider: Uploadcare. Firebase Storage/Blaze is not required.</p>${state.config.uploadcarePublicKey?'<div class=ok>✅ Uploadcare configured — bill photos will be available live on every device.</div>':'<div class=note>⚠️ Add your Uploadcare Public Key below to enable live photos.</div>'}<div class=form style="margin-top:12px"><div class="field span2"><label>Uploadcare Public Key</label><input id=uckey value="${esc(state.config.uploadcarePublicKey||'')}" placeholder="demopublickey / your project public key"></div><div class=span2><button class=btn onclick=savePhotoSettings()>SAVE PHOTO STORAGE</button></div></div>`:''}<p class=powered>⚡ POWERED BY TECHMANZ</p></div>`}window.savePhotoSettings=async()=>{try{const key=$('uckey').value.trim();if(!key)return toast('Enter Uploadcare Public Key');await setDoc(doc(db,'system','config'),{uploadcarePublicKey:key,imageProvider:'uploadcare',updatedAt:serverTimestamp()},{merge:true});toast('Live photo storage configured')}catch(e){err(e)}};function render(){if(!state.profile)return;let body='';try{body=({dashboard,users,members,meals,inventory,expenses,payments,reports,settings}[state.page]||dashboard)()}catch(e){body=`<div class=card><h3>Page error</h3><p>${esc(e.message)}</p></div>`}layout(body)}onAuthStateChanged(auth,async u=>{state.unsubs.forEach(f=>f());state.unsubs=[];state.profile=null;if(!u){setTimeout(showAuth,300);return}try{const p=await getDoc(doc(db,'users',u.uid));if(!p.exists()){await signOut(auth);return toast('Account has no assigned role. Contact Admin.')}state.profile={uid:u.uid,...p.data()};if(state.profile.active===false){await signOut(auth);return toast('Account disabled')}state.page='dashboard';listen();render()}catch(e){err(e);await signOut(auth)}});</script></body></html>
